<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Open HTML to Figma</title>
  <style>
    /* Strawberry matcha: matcha background, milk-white glass, strawberry accents. */
    :root {
      --matcha: #74b087;
      --straw: #ff8fb3;
      --berry: #5e1f3d;
      --ink: #143326;
      --muted: #3d5c4c;
      --line: rgba(20, 51, 38, 0.1);
      --well: rgba(20, 51, 38, 0.07);
      --shadow: 0 18px 40px -18px rgba(16, 60, 36, 0.55), 0 3px 10px -4px rgba(16, 60, 36, 0.2);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: "Nunito", "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.32) 1.2px, transparent 1.7px) 0 0 / 13px 13px fixed,
        radial-gradient(70% 50% at 100% 100%, rgba(255, 143, 179, 0.85), transparent 72%) fixed,
        radial-gradient(80% 45% at 0 0, rgba(255, 255, 255, 0.6), transparent 70%) fixed,
        linear-gradient(170deg, #88c197, var(--matcha) 55%, #5e9c74) fixed;
    }

    body {
      margin: 0;
      padding: 0 16px 14px;
      font: 500 12px/1.45 var(--font);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* Header: the mascot peeks over the card; its lower half sits behind the glass. */
    .top {
      position: relative;
      height: 60px;
      display: flex;
      align-items: flex-end;
      padding: 0 104px 10px 4px;
    }

    .top h1 {
      margin: 0;
      font: 900 16px/1.1 var(--font);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .top p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #1e4032;
    }

    .mochi {
      position: absolute;
      right: 2px;
      bottom: -33px;
      width: 92px;
      overflow: visible;
      cursor: pointer;
      transform-origin: bottom;
      filter: drop-shadow(0 8px 12px rgba(16, 60, 36, 0.28));
    }

    .mochi .milk { fill: #fff; }
    .mochi .pink { fill: var(--straw); }
    .mochi .eyes, .mochi .mouth { fill: var(--berry); }
    .mochi .happy { fill: none; stroke: var(--berry); stroke-width: 15; stroke-linecap: round; opacity: 0; }
    .mochi .eyes, .mochi .happy { transform-box: view-box; transform-origin: 256px 300px; }
    .mochi .eyes { animation: blink 5s infinite; }
    .mochi .ear { transform-box: view-box; transition: transform 0.6s var(--spring), rotate 0.4s var(--spring); }
    .mochi .ear-l { transform-origin: 201px 259px; }
    .mochi .ear-r { transform-origin: 311px 259px; animation: twitch 7s 2s infinite; }
    .mochi .cheeks circle { transform-box: fill-box; transform-origin: center; }

    /* It looks at the pointer (--lx / --ly, set by the script) and perks up on hover. */
    .mochi .eyes, .mochi .happy { translate: var(--lx, 0) var(--ly, 0); transition: translate 0.15s ease-out; }
    .mochi:hover .ear-l { rotate: 10deg; }
    .mochi:hover .ear-r { rotate: -10deg; }

    /* Charging while importing, happy on success, droopy ears on error. */
    body:has(#convert.loading) .mochi { animation: bob 0.9s ease-in-out infinite; }
    body:has(#convert.loading) .mochi .cheeks circle { animation: charge 0.45s ease-in-out infinite alternate; }
    body:has(#status.ok) .mochi { animation: hop 0.7s var(--spring); }
    body:has(#status.ok) .mochi .eyes { opacity: 0; animation: none; }
    body:has(#status.ok) .mochi .happy { opacity: 1; }
    body:has(#status.error) .mochi .ear { animation: none; }
    body:has(#status.error) .mochi .ear-l { transform: rotate(-30deg); }
    body:has(#status.error) .mochi .ear-r { transform: rotate(30deg); }

    @keyframes blink { 0%, 93%, 100% { transform: none; } 96% { transform: scaleY(0.1); } }
    @keyframes twitch { 0%, 90%, 100% { transform: none; } 93% { transform: rotate(9deg); } 96% { transform: rotate(-3deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(-9px); } 50% { transform: translateY(-13px); } }
    @keyframes charge { to { transform: scale(1.22); fill: #ff5f97; } }
    @keyframes hop { 40% { transform: translateY(-10px); } }

    /* Liquid glass sheet. The rim light follows the pointer (--mx / --my). */
    .card {
      position: relative;
      z-index: 1;
      padding: 12px;
      border-radius: 24px;
      background: linear-gradient(165deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.5));
      -webkit-backdrop-filter: blur(14px) saturate(1.8);
      backdrop-filter: blur(14px) saturate(1.8);
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1.5px;
      border-radius: inherit;
      background:
        radial-gradient(150px circle at var(--mx, 300px) var(--my, 40px), #fff, transparent) fixed,
        linear-gradient(160deg, #fff, rgba(255, 255, 255, 0.15) 38%, rgba(255, 255, 255, 0.15) 62%, rgba(255, 255, 255, 0.75));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .field {
      margin-bottom: 10px;
    }

    .field-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 4px 7px;
      font: 800 10.5px/1 var(--font);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field-label .link {
      padding: 0;
      border: 0;
      background: none;
      color: var(--berry);
      font: 700 11px/1 var(--font);
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
    }

    .field-label .link:hover { text-decoration: underline; text-underline-offset: 2px; }

    /* Segmented control: one glass pill slides (with overshoot) to the active button. */
    .segment {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 3px;
      border-radius: 999px;
      background: var(--well);
      box-shadow: inset 0 1px 3px rgba(20, 51, 38, 0.16), inset 0 -1px 0 rgba(255, 255, 255, 0.6);
    }

    .segment::before {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc((100% - 6px) / 4);
      border-radius: 999px;
      background: linear-gradient(#fff, #f6fbf7);
      box-shadow: 0 3px 8px -2px rgba(16, 60, 36, 0.3), inset 0 -1px 1px rgba(16, 60, 36, 0.06);
      transform: translateX(calc(var(--i, 0) * 100%));
      transition: transform 0.5s var(--spring);
    }

    .segment:has(> :nth-child(2).active) { --i: 1; }
    .segment:has(> :nth-child(3).active) { --i: 2; }
    .segment:has(> :nth-child(4).active) { --i: 3; }

    .segment button {
      position: relative;
      margin: 0;
      padding: 7px 0;
      border: 0;
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font: 700 11.5px/1.2 var(--font);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .segment button:hover, .segment button.active { color: var(--ink); }

    /* Options: an inset group of rows with jelly switches. */
    .group {
      margin-bottom: 10px;
      padding: 0 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      cursor: pointer;
    }

    .option + .option { border-top: 1px solid var(--line); }

    .option-text { flex: 1; min-width: 0; }
    .option-text b { display: block; font-weight: 800; }
    .option-text small { display: block; font-size: 10.5px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch {
      position: relative;
      flex: none;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: rgba(20, 51, 38, 0.16);
      box-shadow: inset 0 1px 3px rgba(20, 51, 38, 0.22);
      transition: background 0.3s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(20, 51, 38, 0.3), inset 0 -1px 1px rgba(20, 51, 38, 0.08);
      transition: transform 0.45s var(--spring), width 0.2s ease;
    }

    .option:active .switch::after { width: 23px; }
    .option input:checked + .switch { background: linear-gradient(#ffabc8, #ff85ad); box-shadow: inset 0 1px 3px rgba(150, 20, 70, 0.3); }
    .option input:checked + .switch::after { transform: translateX(16px); }
    .option:active input:checked + .switch::after { transform: translateX(11px); }
    .option input:focus-visible + .switch { outline: 2px solid var(--berry); outline-offset: 2px; }

    /* File tile */
    .file-zone {
      position: relative;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 12px 8px 8px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8), 0 1px 2px rgba(16, 60, 36, 0.08);
      cursor: pointer;
      transition: transform 0.35s var(--spring), background 0.2s ease;
    }

    .file-zone:hover { background: rgba(255, 255, 255, 0.78); transform: translateY(-1px); }
    .file-zone:focus-within { box-shadow: inset 0 0 0 1px #fff, 0 0 0 3px rgba(255, 143, 179, 0.55); }

    .file-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-icon {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--berry);
      background: linear-gradient(#ffd3e1, #ffa6c4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 4px 10px -4px rgba(214, 51, 111, 0.6);
    }

    .file-icon .check, .file-zone.has-file .file-icon .doc { display: none; }
    .file-zone.has-file .file-icon .check { display: block; }
    .file-zone.has-file .file-icon {
      color: var(--ink);
      background: linear-gradient(#d3f0dc, #9bd6ad);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 4px 10px -4px rgba(16, 90, 50, 0.5);
    }

    .file-meta { min-width: 0; flex: 1; }

    .file-meta .title {
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta .desc { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 4px;
      color: var(--muted);
      font: 800 10px/1 var(--font);
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    textarea {
      display: block;
      width: 100%;
      height: 80px;
      resize: vertical;
      padding: 10px 12px;
      border: 0;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.42);
      box-shadow: inset 0 2px 5px rgba(20, 51, 38, 0.13), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
      color: var(--ink);
      font: 11.5px/1.5 var(--mono);
      outline: none;
      transition: box-shadow 0.2s ease, background 0.2s ease;
    }

    textarea::placeholder { color: #587666; }

    textarea:focus {
      background: rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 2px 5px rgba(20, 51, 38, 0.1), 0 0 0 3px rgba(255, 143, 179, 0.55);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    /* Strawberry jelly button */
    .primary {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 999px;
      color: var(--berry);
      font: 900 14px/1 var(--font);
      background: linear-gradient(#ffc4d7, #ff93b6);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -3px 8px rgba(214, 51, 111, 0.35),
        0 12px 24px -10px rgba(214, 51, 111, 0.75);
      cursor: pointer;
      transition: transform 0.35s var(--spring), filter 0.2s ease;
    }

    .primary::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 16px;
      right: 16px;
      height: 46%;
      border-radius: 999px;
      background: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .primary:hover:not(:disabled) { transform: translateY(-1px); filter: saturate(1.12); }
    .primary:active:not(:disabled) { transform: scale(0.97); }
    .primary:focus-visible { outline: 2px solid var(--berry); outline-offset: 3px; }
    .primary:disabled { cursor: wait; }

    .primary.loading::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
      animation: sweep 1.3s ease-in-out infinite;
    }

    .primary.loading .bolt { display: none; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(94, 31, 61, 0.25);
      border-top-color: var(--berry);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .primary.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    #status {
      padding: 8px 13px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.5);
      -webkit-backdrop-filter: blur(10px) saturate(1.6);
      backdrop-filter: blur(10px) saturate(1.6);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
      font-size: 11px;
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      vertical-align: 1px;
      border-radius: 50%;
      background: #86b896;
    }

    #status.ok { background: rgba(222, 247, 230, 0.82); color: #1a5c37; }
    #status.ok::before { background: #34a862; box-shadow: 0 0 0 3px rgba(52, 168, 98, 0.25); }
    #status.error { background: rgba(255, 229, 238, 0.9); color: #8e1f4a; }
    #status.error::before { background: #e0457f; box-shadow: 0 0 0 3px rgba(224, 69, 127, 0.25); }
    body:has(#convert.loading) #status::before { background: var(--straw); animation: pulse 0.9s ease-in-out infinite; }

    @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255, 143, 179, 0.45); } }

    .hint, .credit {
      margin: 0;
      font-size: 10.5px;
      line-height: 1.4;
      text-align: center;
      color: var(--ink);
    }

    .credit a {
      color: var(--berry);
      font-weight: 800;
      text-decoration: none;
    }

    .credit a:hover { text-decoration: underline; text-underline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *:not(.spinner), *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Keep the measure iframe in-viewport. Off-screen / visibility:hidden
       iframes are often throttled inside Figma's plugin UI, which yields
       empty or collapsed layout measurements. */
    #render-host {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

       Inlined so the plugin UI itself makes no network requests. */

        <button type="button" data-w="1440" data-h="1024" class="active">Desktop</button>
        <button type="button" data-w="1280" data-h="832">Laptop</button>
        <button type="button" data-w="768" data-h="1024">Tablet</button>
        <button type="button" data-w="390" data-h="844">Mobile</button>
      </div>
    </div>

    <div class="group">
      <label class="option">
        <span class="option-text"><b>Create as component</b><small>Root frame becomes a component</small></span>
        <input id="as-component" type="checkbox" /><span class="switch" aria-hidden="true"></span>
      </label>
      <label class="option">
        <span class="option-text"><b>Execute page scripts</b><small>Only for trusted, JS-rendered pages</small></span>
        <input id="run-scripts" type="checkbox" /><span class="switch" aria-hidden="true"></span>
      </label>
    </div>

    <div class="field">
      <span class="field-label">File <button type="button" class="link" id="pick-folder">or pick its folder</button></span>
      <label class="file-zone" id="file-zone" for="file">
        <input id="file" type="file" multiple accept=".html,.htm,text/html,.css,.js,.svg,image/*,.woff,.woff2,.ttf,.otf" />
        <div class="file-icon">
          <svg class="doc" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 2.5h6l3 3V13.5h-9v-11z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9.5 2.5V5.5H12.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <svg class="check" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="file-meta">
          <div class="title" id="file-title">Choose HTML file</div>
          <div class="desc" id="file-desc">.html, plus its CSS / images if local</div>
        </div>
      </label>
      <input id="folder" type="file" webkitdirectory hidden />
    </div>

    <div class="divider">or paste</div>

    <textarea id="html" placeholder="Paste your HTML here…" spellcheck="false" aria-label="HTML"></textarea>
  </main>

  <div class="actions">
    <button class="primary" id="convert" type="button">
      <span class="spinner" aria-hidden="true"></span>
      <svg class="bolt" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <span id="convert-label">Import to Figma</span>
    </button>
    <div id="status" aria-live="polite">Ready</div>
    <p class="hint">Install page fonts in Figma for the closest match.</p>
    <p class="credit">Brewed by <a href="https://www.linkedin.com/in/bryan-kevin/" target="_blank" rel="noopener noreferrer">Kevin</a></p>
  </div>

  <!-- Isolated browser document used for layout measurement. -->
  <div id="render-host" aria-hidden="true"></div>


  <script>
    const fileInput = document.getElementById('file');
    const fileZone = document.getElementById('file-zone');
    const fileTitle = document.getElementById('file-title');
    const fileDesc = document.getElementById('file-desc');
    const htmlInput = document.getElementById('html');
    const convertBtn = document.getElementById('convert');
    const convertLabel = document.getElementById('convert-label');
    const statusEl = document.getElementById('status');
    const renderHost = document.getElementById('render-host');
    const viewportBtns = document.querySelectorAll('#viewports button');
    const asComponentInput = document.getElementById('as-component');
    const runScriptsInput = document.getElementById('run-scripts');
    const folderInput = document.getElementById('folder');
    let assetFiles = []; // local CSS / JS / images / fonts picked with the page

    let viewport = { w: 1440, h: 1024 };
    let isImporting = false;
    let importTimeout = null;
    let scriptsSkipped = false;

    viewportBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        viewportBtns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        viewport = { w: parseInt(btn.getAttribute('data-w'), 10), h: parseInt(btn.getAttribute('data-h'), 10) };
      });
    });

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || '';
    }

    function setImporting(importing, label) {
      isImporting = importing;
      convertBtn.disabled = importing;
      convertBtn.classList.toggle('loading', importing);
      convertLabel.textContent = label || (importing ? 'Importing…' : 'Import to Figma');
      if (!importing && importTimeout) {
        clearTimeout(importTimeout);
        importTimeout = null;
      }
    }

    function isHtmlFile(file) {
      if (!file) return false;
      return /\.(html?|xhtml)$/i.test(file.name) ||
        file.type === 'text/html' ||
        file.type === 'application/xhtml+xml';
    }

    function resetFilePicker() {
      fileInput.value = '';
      folderInput.value = '';
      assetFiles = [];
      fileZone.classList.remove('has-file');
      fileTitle.textContent = 'Choose HTML file';
      fileDesc.textContent = '.html, plus its CSS / images if local';
    }

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise(function (_, reject) {
          setTimeout(function () {
            reject(new Error((label || 'Operation') + ' timed out'));
          }, ms);
        })
      ]);
    }

    /** The page is the (shallowest, preferably index) HTML file; the rest are its assets. */
    async function loadPicked(files) {
      const list = Array.prototype.slice.call(files || []);
      if (!list.length) return;
      const path = function (f) { return f.webkitRelativePath || f.name; };
      const page = list.filter(isHtmlFile).sort(function (a, b) {
        return /(^|\/)index\.html?$/i.test(path(b)) - /(^|\/)index\.html?$/i.test(path(a)) ||
          path(a).split('/').length - path(b).split('/').length;
      })[0];
      if (!page) {
        resetFilePicker();
        setStatus('Choose an HTML file (.html or .htm). "' + list[0].name + '" is not supported.', 'error');
        return;
      }
      try {
        htmlInput.value = await page.text();
        assetFiles = list.filter(function (f) { return f !== page; });
        fileZone.classList.add('has-file');
        fileTitle.textContent = page.name;
        fileDesc.textContent = Math.max(1, Math.round(page.size / 1024)) + ' KB loaded' +
          (assetFiles.length ? ' · ' + assetFiles.length + ' local asset' + (assetFiles.length > 1 ? 's' : '') : '');
        setStatus('File loaded — ready to import');
      } catch (err) {
        resetFilePicker();
        setStatus('Failed to read file: ' + err.message, 'error');
      }
    }

    fileInput.addEventListener('change', function () { loadPicked(fileInput.files); });
    folderInput.addEventListener('change', function () { loadPicked(folderInput.files); });
    document.getElementById('pick-folder').addEventListener('click', function () { folderInput.click(); });

    async function replaceAsync(str, re, fn) {
      const parts = [];
      let last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(str))) {
        parts.push(str.slice(last, m.index), fn.apply(null, m));
        last = m.index + m[0].length;
      }
      parts.push(str.slice(last));
      return (await Promise.all(parts)).join('');
    }

    /** Relative refs (style.css, img/hero.jpg, fonts) → inline / data: URLs from the picked files,
     *  since the page renders from a string and has no folder to resolve them against. */
    async function inlineAssets(html, files) {
      if (!files.length) return html;
      const entries = files.map(function (f) { return { f: f, path: (f.webkitRelativePath || f.name).toLowerCase() }; });
      const find = function (ref) {
        if (!ref || /^(https?:|data:|blob:|mailto:|#|\/\/)/i.test(ref.trim())) return null;
        let p;
        try { p = decodeURIComponent(ref.trim().split(/[?#]/)[0]); } catch (e) { p = ref.trim(); }
        p = p.toLowerCase().replace(/^(\.\.?\/)+|^\//g, '');
        const base = p.split('/').pop();
        const hit = entries.find(function (e) { return e.path === p || e.path.endsWith('/' + p); }) ||
          entries.find(function (e) { return e.path.split('/').pop() === base; }); // ponytail: basename fallback
        return hit ? hit.f : null;
      };
      const cache = new Map();
      const dataUrl = function (f) {
        if (!cache.has(f)) cache.set(f, new Promise(function (resolve) {
          const reader = new FileReader();
          reader.onload = function () { resolve(reader.result); };
          reader.readAsDataURL(f);
        }));
        return cache.get(f);
      };
      const css = function (text) {
        return replaceAsync(text, /url\(\s*(['"]?)([^'")]+)\1\s*\)/g, async function (m, q, ref) {
          const f = find(ref);
          return f ? 'url("' + await dataUrl(f) + '")' : m;
        });
      };
      const d = new DOMParser().parseFromString(html, 'text/html');
      const all = function (sel) { return Array.prototype.slice.call(d.querySelectorAll(sel)); };
      for (const link of all('link[rel~="stylesheet"][href]')) {
        const f = find(link.getAttribute('href'));
        if (!f) continue;
        const style = d.createElement('style');
        style.textContent = await css(await f.text()); // ponytail: @import inside it isn't followed
        link.replaceWith(style);
      }
      for (const el of all('style')) el.textContent = await css(el.textContent);
      for (const el of all('[style]')) el.setAttribute('style', await css(el.getAttribute('style')));
      for (const el of all('script[src]')) {
        const f = find(el.getAttribute('src'));
        if (f) { el.removeAttribute('src'); el.textContent = await f.text(); }
      }
      for (const el of all('[src], [poster], object[data]')) {
        for (const a of ['src', 'poster', 'data']) {
          const f = el.hasAttribute(a) && find(el.getAttribute(a));
          if (f) el.setAttribute(a, await dataUrl(f));
        }
      }
      for (const el of all('[srcset]')) {
        const f = find(el.getAttribute('srcset').trim().split(/\s+/)[0]);
        if (f) el.setAttribute('srcset', await dataUrl(f));
      }
      return (d.doctype ? '<!DOCTYPE html>\n' : '') + d.documentElement.outerHTML;
    }

    // =========================================================================
    // Capture: render the HTML in an isolated iframe and measure what the
    // browser actually drew. Geometry is in page px; paints are Figma-ready.
    // =========================================================================

    let doc = null;             // render iframe document / window (one import at a time)
    let win = null;
    let imageStore = {};        // id -> raw base64 PNG/JPEG
    let imageSeq = 0;
    let imageLoads = new Map(); // url -> Promise<HTMLImageElement | null>
    let fontCheck = new Map();  // family -> did the browser have it?
    let fontProbe = null;
    let bodyBgOnCanvas = false; // body background is painted by the root frame

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const SIDES = ['Top', 'Right', 'Bottom', 'Left'];
    const BLACK = { r: 0, g: 0, b: 0, a: 1 };
    const ACCENT = { r: 0, g: 0.459, b: 1, a: 1 }; // Chrome's default accent-color
    const SKIP_TAGS = new Set(['SCRIPT', 'STYLE', 'LINK', 'META', 'NOSCRIPT', 'HEAD', 'TITLE', 'TEMPLATE',
      'BR', 'WBR', 'SOURCE', 'TRACK', 'PARAM', 'MAP', 'AREA', 'DATALIST', 'OPTION', 'OPTGROUP']);
    // Drawn from their own pixels / value; children are not walked.
    const REPLACED = new Set(['IMG', 'SVG', 'VIDEO', 'CANVAS', 'IFRAME', 'EMBED', 'OBJECT', 'AUDIO',
      'INPUT', 'SELECT', 'TEXTAREA', 'PROGRESS', 'METER']);

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function px(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
    function rectOf(r) { return { x: r.left, y: r.top, w: r.width, h: r.height }; }

    function boundsOf(rects) {
      let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
      Array.prototype.forEach.call(rects, function (q) {
        l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom);
      });
      return l === Infinity ? { x: 0, y: 0, w: 0, h: 0 } : { x: l, y: t, w: r - l, h: b - t };
    }

    function contentBox(el, cs) {
      const r = el.getBoundingClientRect();
      const l = px(cs.borderLeftWidth) + px(cs.paddingLeft);
      const t = px(cs.borderTopWidth) + px(cs.paddingTop);
      return {
        x: r.left + l,
        y: r.top + t,
        w: r.width - l - px(cs.borderRightWidth) - px(cs.paddingRight),
        h: r.height - t - px(cs.borderBottomWidth) - px(cs.paddingBottom)
      };
    }

    // -------------------------------------------------------------------------
    // CSS value parsing
    // -------------------------------------------------------------------------

    /** Split on `sep` outside parentheses and quotes (sep ' ' = any whitespace). */
    function splitTopLevel(str, sep) {
      const out = [];
      let cur = '', depth = 0, quote = '';
      for (const ch of String(str || '')) {
        if (quote) { if (ch === quote) quote = ''; }
        else if (ch === '"' || ch === "'") quote = ch;
        else if (ch === '(') depth++;
        else if (ch === ')') depth--;
        else if (depth === 0 && (sep === ' ' ? /\s/.test(ch) : ch === sep)) {
          if (cur.trim()) out.push(cur.trim());
          cur = '';
          continue;
        }
        cur += ch;
      }
      if (cur.trim()) out.push(cur.trim());
      return out;
    }

    /** Top-level function calls: "blur(4px) drop-shadow(…)" → [{name, args}]. */
    function cssFunctions(str) {
      const out = [];
      const s = String(str || '');
      const re = /([a-z-]+)\(/gi;
      let m;
      while ((m = re.exec(s))) {
        let depth = 1, quote = '', j = m.index + m[0].length;
        for (; j < s.length && depth; j++) {
          const ch = s[j];
          if (quote) { if (ch === quote) quote = ''; }
          else if (ch === '"' || ch === "'") quote = ch;
          else if (ch === '(') depth++;
          else if (ch === ')') depth--;
        }
        out.push({ name: m[1].toLowerCase(), args: s.slice(m.index + m[0].length, j - 1) });
        re.lastIndex = j;
      }
      return out;
    }

    /** Computed length / percentage / keyword / simple calc(% ± px) → px, % of `basis`. */
    function lenPx(tok, basis) {
      const t = String(tok || '').trim();
      const kw = { left: 0, top: 0, center: 50, right: 100, bottom: 100 }[t];
      if (kw !== undefined) return basis * kw / 100;
      let v = 0;
      (t.replace(/^calc\(/, '').match(/[-+]?\s*[\d.]+(?:e[-+]?\d+)?%?/gi) || []).forEach(function (term) {
        const n = parseFloat(term.replace(/\s+/g, ''));
        v += /%$/.test(term) ? basis * n / 100 : n;
      });
      return v;
    }

    /** background-position / object-position axis: offset of an item inside `free` space. */
    function posOffset(tok, free) {
      const m = String(tok || '').trim().match(/^(left|right|top|bottom|center)\s+(.+)$/);
      if (!m) return lenPx(tok, free);
      const off = lenPx(m[2], free);
      return m[1] === 'right' || m[1] === 'bottom' ? free - off : off;
    }

    function angleDeg(tok) {
      const m = String(tok || '').trim().match(/^(-?[\d.]+)(deg|rad|turn|grad)?$/);
      if (!m) return 0;
      const v = parseFloat(m[1]);
      return m[2] === 'rad' ? v * 180 / Math.PI : m[2] === 'turn' ? v * 360 : m[2] === 'grad' ? v * 0.9 : v;
    }

    /** Any CSS color → {r,g,b,a} in 0–1. Fully transparent → null unless keepClear. */
    function parseColor(css, keepClear) {
      const raw = String(css || '').trim();
      if (!raw || raw === 'none' || /^currentcolor$/i.test(raw)) return null;
      const c = parseHexOrRgb(raw) || parseSrgb(raw) || canvasColor(raw);
      if (!c) return null;
      return c.a < 0.004 && !keepClear ? null : c;
    }

    function parseHexOrRgb(raw) {
      const hex = raw.match(/^#([0-9a-f]{3,8})$/i);
      if (hex) {
        let h = hex[1];
        if (h.length === 3 || h.length === 4) h = h.split('').map(function (c) { return c + c; }).join('');
        return {
          r: parseInt(h.slice(0, 2), 16) / 255,
          g: parseInt(h.slice(2, 4), 16) / 255,
          b: parseInt(h.slice(4, 6), 16) / 255,
          a: h.length >= 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1
        };
      }
      // rgb(1, 2, 3) / rgba(1, 2, 3, 0.5) / rgb(1 2 3 / 50%)
      const m = raw.match(/^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)(?:\s*[,/]\s*([\d.]+%?))?\s*\)$/i);
      if (!m) return null;
      return {
        r: Math.min(255, parseFloat(m[1])) / 255,
        g: Math.min(255, parseFloat(m[2])) / 255,
        b: Math.min(255, parseFloat(m[3])) / 255,
        a: m[4] === undefined ? 1 : /%$/.test(m[4]) ? parseFloat(m[4]) / 100 : parseFloat(m[4])
      };
    }

    function parseSrgb(raw) {
      const m = raw.match(/^color\(\s*srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)(?:\s*\/\s*([\d.]+%?))?\s*\)$/i);
      if (!m) return null;
      const c = function (v) { return Math.max(0, Math.min(1, parseFloat(v))); };
      return { r: c(m[1]), g: c(m[2]), b: c(m[3]), a: m[4] === undefined ? 1 : /%$/.test(m[4]) ? parseFloat(m[4]) / 100 : parseFloat(m[4]) };
    }

    /** lab() / oklch() / named colors: let a canvas convert them to sRGB. */
    function canvasColor(raw) {
      const ctx = canvasColor.ctx || (canvasColor.ctx = document.createElement('canvas').getContext('2d', { willReadFrequently: true }));
      ctx.fillStyle = '#010203';
      ctx.fillStyle = raw;
      const norm = String(ctx.fillStyle);
      if (norm === '#010203') return null; // not a color
      const parsed = parseHexOrRgb(norm) || parseSrgb(norm);
      if (parsed) return parsed;
      ctx.clearRect(0, 0, 1, 1);
      ctx.fillRect(0, 0, 1, 1);
      const d = ctx.getImageData(0, 0, 1, 1).data;
      return { r: d[0] / 255, g: d[1] / 255, b: d[2] / 255, a: d[3] / 255 };
    }

    function hex(c) {
      const h = function (n) { return Math.round(n * 255).toString(16).padStart(2, '0'); };
      return '#' + h(c.r) + h(c.g) + h(c.b);
    }

    function sameRgb(a, b) {
      return Math.abs(a.r - b.r) < 0.004 && Math.abs(a.g - b.g) < 0.004 && Math.abs(a.b - b.b) < 0.004;
    }

    function sameColor(a, b) { return sameRgb(a, b) && Math.abs(a.a - b.a) < 0.004; }

    function lerpColor(a, b, k) {
      return { r: a.r + (b.r - a.r) * k, g: a.g + (b.g - a.g) * k, b: a.b + (b.b - a.b) * k, a: a.a + (b.a - a.a) * k };
    }

    // -------------------------------------------------------------------------
    // Paints: solid / gradient / image, bottom → top (Figma order)
    // -------------------------------------------------------------------------

    function solidPaint(c) { return { type: 'SOLID', color: c }; }
    function imagePaint(id) { return { type: 'IMAGE', scaleMode: 'FILL', imageRef: id }; }

    function storeImage(b64) {
      if (!b64) return null;
      const id = 'img' + (imageSeq++);
      imageStore[id] = b64;
      return id;
    }

    function makeCanvas(w, h, maxScale) {
      const s = Math.min(maxScale || 2, 4096 / Math.max(w, h, 1));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * s));
      c.height = Math.max(1, Math.round(h * s));
      const ctx = c.getContext('2d');
      ctx.scale(c.width / w, c.height / h);
      return { c: c, ctx: ctx };
    }

    /** base64 PNG, or JPEG when `photo` and every pixel is opaque (photos stay small). */
    function canvasB64(c, photo) {
      try {
        let jpeg = false;
        if (photo) {
          const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
          jpeg = true;
          for (let i = 3; i < d.length; i += 16) if (d[i] < 255) { jpeg = false; break; }
        }
        const url = c.toDataURL(jpeg ? 'image/jpeg' : 'image/png', 0.9);
        return url.slice(url.indexOf(',') + 1);
      } catch (e) {
        return null; // tainted by a cross-origin image
      }
    }

    function loadImage(url) {
      if (!imageLoads.has(url)) {
        imageLoads.set(url, new Promise(function (resolve) {
          const img = new Image();
          if (!/^(data|blob):/i.test(url)) img.crossOrigin = 'anonymous';
          const timer = setTimeout(function () { resolve(null); }, 10000);
          img.onload = function () { clearTimeout(timer); resolve(img); };
          img.onerror = function () { clearTimeout(timer); resolve(null); };
          img.src = url;
        }));
      }
      return imageLoads.get(url);
    }

    async function drawUrl(url, w, h) {
      const img = await loadImage(url);
      if (!img) return null;
      const k = makeCanvas(w, h);
      k.ctx.drawImage(img, 0, 0, w, h);
      return canvasB64(k.c);
    }

    function isColorToken(part) { return !!parseColor(splitTopLevel(part, ' ')[0], true); }

    /** CSS color stops → Figma stops in [0,1]. `len` = gradient ray length for px stops. */
    function gradientStops(parts, len) {
      len = Math.max(len, 1e-6);
      const stops = [];
      parts.forEach(function (part) {
        let color = null;
        const pos = [];
        splitTopLevel(part, ' ').forEach(function (t) {
          if (/^[-+.\d]|^calc\(/i.test(t)) pos.push(lenPx(t, len) / len);
          else color = parseColor(t, true) || color;
        });
        if (!color) return; // interpolation hint
        if (!pos.length) stops.push({ pos: null, color: color });
        pos.forEach(function (p) { stops.push({ pos: p, color: color }); });
      });
      if (!stops.length) return null;
      if (stops.length === 1) stops.push({ pos: 1, color: stops[0].color });
      if (stops[0].pos === null) stops[0].pos = 0;
      if (stops[stops.length - 1].pos === null) stops[stops.length - 1].pos = 1;
      let max = -Infinity;
      stops.forEach(function (s) { if (s.pos !== null) { s.pos = Math.max(s.pos, max); max = s.pos; } });
      for (let i = 1; i < stops.length; i++) {
        if (stops[i].pos !== null) continue;
        let j = i;
        while (stops[j].pos === null) j++;
        const a = stops[i - 1].pos, b = stops[j].pos;
        for (let k = i; k < j; k++) stops[k].pos = a + (b - a) * (k - i + 1) / (j - i + 1);
      }
      // CSS interpolates premultiplied: a transparent stop takes its neighbours'
      // hue instead of fading through black.
      const out = [];
      stops.forEach(function (s, i) {
        if (s.color.a > 0.001) { out.push(s); return; }
        const p = i > 0 && stops[i - 1].color.a > 0.001 ? stops[i - 1].color : null;
        const n = i < stops.length - 1 && stops[i + 1].color.a > 0.001 ? stops[i + 1].color : null;
        if (!p && !n) { out.push(s); return; }

      'font-family', 'font-size', 'font-weight', 'font-style', 'text-anchor', 'dominant-baseline', 'visibility'];
    const SVG_DEFAULTS = {
      'fill-opacity': '1', 'fill-rule': 'nonzero', stroke: 'none', 'stroke-width': '1px', 'stroke-opacity': '1',
      'stroke-linecap': 'butt', 'stroke-linejoin': 'miter', 'stroke-dasharray': 'none', 'stroke-dashoffset': '0px',
      'stroke-miterlimit': '4', opacity: '1', 'stop-opacity': '1', 'font-style': 'normal', 'text-anchor': 'start',
      'dominant-baseline': 'auto', visibility: 'visible'
    };

    /** Inline SVG → standalone markup Figma can import as vectors: computed styles
     *  (classes, currentColor) baked into attributes, <use>/external defs resolved. */
    function svgMarkup(svg, w, h) {
      const clone = svg.cloneNode(true);
      const src = [svg].concat(Array.prototype.slice.call(svg.querySelectorAll('*')));
      const dst = [clone].concat(Array.prototype.slice.call(clone.querySelectorAll('*')));
      src.forEach(function (s, i) {
        const d = dst[i], tag = s.tagName.toLowerCase();
        if (tag === 'style' || tag === 'script') { d.remove(); return; }
        const c = win.getComputedStyle(s);
        const text = /^(text|tspan|textpath)$/.test(tag);
        SVG_PROPS.forEach(function (p) {
          if (/^(font|text|dominant)/.test(p) && !text) return;
          if (/^stop/.test(p) && tag !== 'stop') return;
          const v = c.getPropertyValue(p);
          if (!v || v === SVG_DEFAULTS[p]) return;
          d.setAttribute(p, v.replace(/url\("?[^"#)]*(#[^")]+)"?\)/g, 'url($1)').replace(/(\d)px\b/g, '$1'));
        });
        if (tag === 'use') d.setAttribute('data-h2f-color', c.color);
      });

      // <use href="#id"> → inline copy (sprites often live in another <svg> on the page).
      Array.prototype.forEach.call(clone.querySelectorAll('use'), function (u) {
        const id = (u.getAttribute('href') || u.getAttribute('xlink:href') || '').replace(/^#/, '');
        const ref = id && (clone.querySelector('[id="' + CSS.escape(id) + '"]') || doc.getElementById(id));
        if (!ref) return;
        const symbol = ref.tagName.toLowerCase() === 'symbol';
        const g = doc.createElementNS(SVG_NS, symbol ? 'svg' : 'g');
        Array.prototype.forEach.call(u.attributes, function (a) {
          if (!/^((xlink:)?href|x|y|width|height|id|data-h2f-color)$/.test(a.name)) g.setAttribute(a.name, a.value);
        });
        const x = u.getAttribute('x') || '0', y = u.getAttribute('y') || '0';
        if (symbol) {
          // The symbol's own attributes (fill="none", stroke…) beat what <use> passes down.
          Array.prototype.forEach.call(ref.attributes, function (a) { if (a.name !== 'id') g.setAttribute(a.name, a.value); });
          g.setAttribute('x', x);
          g.setAttribute('y', y);
          g.setAttribute('width', u.getAttribute('width') || '100%');
          g.setAttribute('height', u.getAttribute('height') || '100%');
          Array.prototype.forEach.call(ref.childNodes, function (n) { g.appendChild(n.cloneNode(true)); });
        } else {
          g.setAttribute('transform', 'translate(' + x + ' ' + y + ')' + (u.getAttribute('transform') ? ' ' + u.getAttribute('transform') : ''));
          const copy = ref.cloneNode(true);
          copy.removeAttribute('id');
          g.appendChild(copy);
        }
        const color = u.getAttribute('data-h2f-color');
        [g].concat(Array.prototype.slice.call(g.querySelectorAll('*'))).forEach(function (n) {
          ['fill', 'stroke'].forEach(function (a) { if (/^currentcolor$/i.test(n.getAttribute(a) || '')) n.setAttribute(a, color); });
        });
        u.replaceWith(g);
      });

      // Gradients / clip paths referenced from elsewhere in the page.
      const ids = new Set();
      [clone].concat(Array.prototype.slice.call(clone.querySelectorAll('*'))).forEach(function (n) {
        Array.prototype.forEach.call(n.attributes, function (a) {
          const re = /url\(#([^)]+)\)/g;
          let m;
          while ((m = re.exec(a.value))) ids.add(m[1]);
          if (/href$/.test(a.name) && a.value[0] === '#') ids.add(a.value.slice(1));
        });
      });
      let defs = null;
      ids.forEach(function (id) {
        if (clone.querySelector('[id="' + CSS.escape(id) + '"]')) return;
        const ref = doc.getElementById(id);
        if (!ref) return;
        defs = defs || clone.insertBefore(doc.createElementNS(SVG_NS, 'defs'), clone.firstChild);
        defs.appendChild(ref.cloneNode(true)); // ponytail: one level; refs inside refs aren't followed
      });

      clone.setAttribute('width', String(w));
      clone.setAttribute('height', String(h));
      return new XMLSerializer().serializeToString(clone);
    }

    /** <img src="….svg"> / data: SVG → markup, so it imports as vectors too. */
    async function svgFromUrl(src, w, h, fit) {
      let text = null;
      try {
        if (/^data:/i.test(src)) {
          const i = src.indexOf(',');
          const data = src.slice(i + 1);
          text = /;base64/i.test(src.slice(0, i))
            ? new TextDecoder().decode(Uint8Array.from(atob(data), function (c) { return c.charCodeAt(0); }))
            : decodeURIComponent(data);
        } else {
          const res = await fetch(src);
          if (res.ok) text = await res.text();
        }
      } catch (e) {
        return null;
      }
      if (!text) return null;
      const svg = new DOMParser().parseFromString(text, 'image/svg+xml').documentElement;
      if (!svg || svg.nodeName.toLowerCase() !== 'svg' || svg.querySelector('parsererror')) return null;
      const sw = px(svg.getAttribute('width')), sh = px(svg.getAttribute('height'));
      if (!svg.getAttribute('viewBox') && sw && sh) svg.setAttribute('viewBox', '0 0 ' + sw + ' ' + sh);
      svg.setAttribute('width', String(w));
      svg.setAttribute('height', String(h));
      if (fit === 'cover') svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
      return new XMLSerializer().serializeToString(svg);
    }

    function checkSvg(w, h, type, on, accent) {
      const s = Math.min(w, h), x = (w - s) / 2, y = (h - s) / 2, a = hex(accent);
      if (type === 'radio') {
        const c = 'cx="' + w / 2 + '" cy="' + h / 2 + '"';
        return svgDoc(w, h, '<circle ' + c + ' r="' + (s / 2 - 0.5) + '" fill="#fff" stroke="' + (on ? a : '#767676') + '"/>' +
          (on ? '<circle ' + c + ' r="' + s * 0.28 + '" fill="' + a + '"/>' : ''));
      }
      return svgDoc(w, h, '<rect x="' + (x + 0.5) + '" y="' + (y + 0.5) + '" width="' + (s - 1) + '" height="' + (s - 1) +
        '" rx="' + s * 0.2 + '" fill="' + (on ? a : '#fff') + '" stroke="' + (on ? a : '#767676') + '"/>' +
        (on ? '<path d="M' + (x + s * 0.24) + ' ' + (y + s * 0.52) + 'L' + (x + s * 0.43) + ' ' + (y + s * 0.7) + 'L' +
          (x + s * 0.77) + ' ' + (y + s * 0.32) + '" fill="none" stroke="#fff" stroke-width="' + Math.max(1.5, s * 0.14) +
          '" stroke-linecap="round" stroke-linejoin="round"/>' : ''));
    }

    function barSvg(w, h, p, slider, color) {
      const c = hex(color);
      if (slider) {
        const r = Math.min(8, h / 2), cx = r + (w - 2 * r) * p, ty = h / 2 - 2;
        return svgDoc(w, h, '<rect y="' + ty + '" width="' + w + '" height="4" rx="2" fill="#efefef" stroke="#b2b2b2" stroke-width="0.5"/>' +
          '<rect y="' + ty + '" width="' + cx + '" height="4" rx="2" fill="' + c + '"/>' +
          '<circle cx="' + cx + '" cy="' + h / 2 + '" r="' + r + '" fill="' + c + '"/>');
      }
      return svgDoc(w, h, '<rect width="' + w + '" height="' + h + '" rx="' + h / 2 + '" fill="#efefef" stroke="#b2b2b2" stroke-width="0.5"/>' +
        '<rect width="' + w * p + '" height="' + h + '" rx="' + h / 2 + '" fill="' + c + '"/>');
    }

    function controlText(el, cs, text, color, multiline) {
      const cb = contentBox(el, cs);
      const st = runStyle(cs, el, null);
      const lh = st.lineHeight === null ? st.size * 1.2 : st.lineHeight;
      const node = {
        type: 'text', x: cb.x, y: multiline ? cb.y : cb.y + (cb.h - lh) / 2, w: Math.max(cb.w, 1),
        h: multiline ? cb.h : lh, align: mapAlign(cs.textAlign), autoWidth: false
      };
      if (!multiline) node.maxLines = 1;
      node.runs = [cleanRun(Object.assign({}, st, { text: text, lineHeight: lh, color: color || st.color }), node)];
      return node;
    }

    /** Inputs, selects, checkboxes, sliders: their value / placeholder and native look. */
    function formControl(el, cs, node, box, tag) {
      const type = (el.getAttribute('type') || '').toLowerCase();
      const native = cs.appearance !== 'none';
      const accent = parseColor(cs.accentColor) || ACCENT;
      if (tag === 'INPUT' && (type === 'checkbox' || type === 'radio')) {
        if (!native) return;
        node.fills = [];
        node.stroke = null;
        node.children.push(svgChild(checkSvg(box.w, box.h, type, el.checked, accent), box, type));
        return;
      }
      if ((tag === 'INPUT' && type === 'range') || tag === 'PROGRESS' || tag === 'METER') {
        const min = tag === 'PROGRESS' ? 0 : px(el.min);
        const max = el.max === '' ? 100 : px(el.max) || 1;
        const v = tag === 'INPUT' ? el.valueAsNumber : el.value;
        const p = Math.max(0, Math.min(1, (v - min) / ((max - min) || 1)));
        node.fills = [];
        node.stroke = null;
        node.children.push(svgChild(barSvg(box.w, box.h, p, tag === 'INPUT',
          tag === 'METER' ? { r: 0.16, g: 0.63, b: 0.26, a: 1 } : accent), box, tag.toLowerCase()));
        return;
      }
      if (tag === 'INPUT' && type === 'color') {
        const c = parseColor(el.value);
        const cb = contentBox(el, cs);
        if (c) node.children.push({ type: 'frame', name: 'swatch', x: cb.x, y: cb.y, w: cb.w, h: cb.h, fills: [solidPaint(c)], children: [] });
        return;
      }
      if (tag === 'INPUT' && /^(hidden|file|image)$/.test(type)) return;
      let text = '', color = null;
      if (tag === 'SELECT') {
        const o = el.selectedOptions && el.selectedOptions[0];
        text = o ? o.text : '';
      } else if (/^(submit|button|reset)$/.test(type)) {
        text = el.value || (type === 'submit' ? 'Submit' : type === 'reset' ? 'Reset' : '');
      } else {
        text = type === 'password' ? '•'.repeat(el.value.length) : el.value;
        if (!text && el.placeholder) {
          text = el.placeholder;
          color = parseColor(win.getComputedStyle(el, '::placeholder').color) || { r: 0.46, g: 0.46, b: 0.46, a: 1 };
        }
      }
      if (text) node.children.push(controlText(el, cs, text, color, tag === 'TEXTAREA'));
      if (tag === 'SELECT' && native) {
        const s = Math.min(10, box.h * 0.35);
        const col = hex(parseColor(cs.color) || BLACK);
        node.children.push(svgChild(svgDoc(s, s, '<path d="M' + s * 0.15 + ' ' + s * 0.35 + 'L' + s / 2 + ' ' + s * 0.7 + 'L' + s * 0.85 + ' ' + s * 0.35 +
          '" fill="none" stroke="' + col + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'),
          { x: box.x + box.w - px(cs.borderRightWidth) - s - 6, y: box.y + (box.h - s) / 2, w: s, h: s }, 'chevron'));
      }
    }

    // -------------------------------------------------------------------------
    // Replaced elements
    // -------------------------------------------------------------------------

    async function imgContent(el, cs, node, box) {
      const src = el.currentSrc || el.src || '';
      if (el.alt) node.name = 'img "' + el.alt.slice(0, 40) + '"';
      if (!src) return;
      if (/^data:image\/svg\+xml|\.svg(\?|#|$)/i.test(src)) {
        const cb = contentBox(el, cs);
        const markup = await svgFromUrl(src, cb.w, cb.h, cs.objectFit);
        if (markup) { node.children.push(svgChild(markup, cb, 'svg')); return; }
      }
      let b64 = el.complete && el.naturalWidth ? drawReplaced(el, el.naturalWidth, el.naturalHeight, box, cs) : null;
      if (!b64) {
        const img = await loadImage(src); // retry with CORS so the canvas stays readable
        if (img) b64 = drawReplaced(img, img.naturalWidth, img.naturalHeight, box, cs);
      }
      const paint = imagePaintOrNull(b64);
      if (paint) node.fills.push(paint);
      else if (/^https?:/i.test(src)) node.fills.push({ type: 'IMAGE', scaleMode: cs.objectFit === 'contain' ? 'FIT' : 'FILL', url: src });
      else {
        node.fills.push(solidPaint({ r: 0, g: 0, b: 0, a: 0.06 }));
        node.name += ' (not loaded)';
      }
    }

    async function mediaContent(el, cs, node, box, tag) {
      let b64 = null;
      if (tag === 'CANVAS') b64 = drawReplaced(el, el.width, el.height, box, cs);
      if (tag === 'VIDEO') {
        if (el.readyState >= 2) b64 = drawReplaced(el, el.videoWidth, el.videoHeight, box, cs);
        if (!b64 && el.poster) {
          const img = await loadImage(el.poster);
          if (img) b64 = drawReplaced(img, img.naturalWidth, img.naturalHeight, box, cs);
        }
      }
      const paint = imagePaintOrNull(b64);
      node.fills.push(paint || solidPaint(tag === 'VIDEO' ? BLACK : { r: 0.94, g: 0.94, b: 0.94, a: 1 }));
    }

    // -------------------------------------------------------------------------
    // DOM → tree
    // -------------------------------------------------------------------------

    function layerName(el) {
      const named = el.getAttribute('data-h2f-name');
      if (named) return named;
      const tag = el.tagName.toLowerCase();
      if (el.id) return tag + '#' + el.id;
      const cls = (typeof el.className === 'string' ? el.className : '').split(/\s+/)
        .filter(function (c) { return c && !/[:[\]/()!@]/.test(c); }).slice(0, 2);
      const label = el.getAttribute('aria-label');
      return tag + cls.map(function (c) { return '.' + c; }).join('') + (label ? ' – ' + label.slice(0, 40) : '');
    }

    /** Paint order among siblings: negative z < in-flow < positioned < positive z. */
    function zKey(el, cs) {
      const positioned = cs.position !== 'static';
      const z = parseInt(cs.zIndex, 10);
      const parent = el.parentElement;
      const item = parent && /flex|grid/.test(win.getComputedStyle(parent).display);
      if ((positioned || item) && z) return z > 0 ? z + 1 : z - 1;
      return positioned ? 0.5 : 0;
    }

    function finalize(node) {
      const look = node.fills.length || node.stroke || node.effects.length;
      if (!look && !node.children.length) return null;
      const only = node.children.length === 1 && node.children[0];
      if (!look && !node.clip && !node.transform && only && only.type === 'text') {
        // A plain text holder (h1, p, span…) is just its text layer.
        if (node.opacity !== undefined) only.opacity = node.opacity * (only.opacity === undefined ? 1 : only.opacity);
        if (node.blend) only.blend = node.blend;
        only.z = node.z;
        return only;
      }
      return node;
    }

    async function serializeElement(el, deco) {
      const tag = el.tagName.toUpperCase();
      if (SKIP_TAGS.has(tag)) return null;
      const cs = win.getComputedStyle(el);
      if (cs.display === 'none') return null;
      const tf = readTransform(el, cs);
      if (!tf) return serializeBox(el, cs, tag, null, deco);
      // Measure the untransformed box; Figma re-applies the rotation / scale exactly.
      const saved = el.getAttribute('style');
      ['transform', 'rotate', 'scale', 'translate', 'transition'].forEach(function (p) { el.style.setProperty(p, 'none', 'important'); });
      try {
        return await serializeBox(el, cs, tag, tf, deco);
      } finally {
        if (saved === null) el.removeAttribute('style');
        else el.setAttribute('style', saved);
      }
    }

    async function serializeBox(el, cs, tag, tf, deco) {
      if (!el.getClientRects().length) return null; // not rendered (closed <details>…)
      const r0 = el.getBoundingClientRect();
      if (r0.width <= 1.5 && r0.height <= 1.5 && (cs.overflowX !== 'visible' || cs.clip !== 'auto')) return null; // sr-only
      if (cs.clipPath === 'inset(50%)') return null;
      const cleanup = REPLACED.has(tag) ? function () {} : materializePseudos(el);
      try {
        const box = rectOf(el.getBoundingClientRect());
        const node = { type: 'frame', name: layerName(el), x: box.x, y: box.y, w: box.w, h: box.h, fills: [], effects: [], children: [] };
        const isBody = el === doc.body;
        let clipFill = null;
        if (cs.visibility !== 'hidden') {
          const bg = isBody && bodyBgOnCanvas ? [] : await backgroundPaints(el, cs, box);
          if (isClipText(cs)) clipFill = { fills: bg, box: box };
          else node.fills = bg;
          const b = readBorders(cs, box);
          if (b && b.stroke) node.stroke = b.stroke;
          else if (b) node.children.push({ type: 'svg', name: 'border', x: box.x, y: box.y, w: box.w, h: box.h, svg: b.svg, z: -1e9 });
          node.radius = readRadii(cs, box.w, box.h);
          node.effects = readEffects(cs, REPLACED.has(tag));
        }
        const op = parseFloat(cs.opacity);
        if (op < 1) node.opacity = op;
        if (cs.mixBlendMode && cs.mixBlendMode !== 'normal') node.blend = cs.mixBlendMode.toUpperCase().replace(/-/g, '_');
        node.clip = !isBody && (cs.overflowX !== 'visible' || cs.overflowY !== 'visible' || /^(INPUT|SELECT|TEXTAREA)$/.test(tag));
        if (tf) node.transform = tf;

        if (tag === 'SVG') {
          if (box.w < 0.5 || box.h < 0.5) return null;
          const markup = svgMarkup(el, box.w, box.h);
          if (/<foreignObject/i.test(markup)) { // HTML inside SVG: Figma can't import it, raster instead
            node.fills = [imagePaintOrNull(await drawUrl('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup), box.w, box.h))].filter(Boolean);
            node.z = zKey(el, cs);
            return finalize(node);
          }
          return {
            type: 'svg', name: el.getAttribute('aria-label') || 'svg', x: box.x, y: box.y, w: box.w, h: box.h, svg: markup,
            opacity: node.opacity, blend: node.blend, effects: node.effects, transform: node.transform,
            clip: cs.overflowX !== 'visible', z: zKey(el, cs)
          };
        }
        if (tag === 'IMG') await imgContent(el, cs, node, box);
        else if (tag === 'CANVAS' || tag === 'VIDEO') await mediaContent(el, cs, node, box, tag);
        else if (/^(IFRAME|EMBED|OBJECT|AUDIO)$/.test(tag)) node.fills.push(solidPaint({ r: 0.94, g: 0.94, b: 0.94, a: 1 }));
        else if (REPLACED.has(tag)) formControl(el, cs, node, box, tag);
        else await serializeContent(el, cs, node, clipFill, decoLine(cs) || deco);
        if (cs.visibility !== 'hidden') listMarker(el, cs, node);
        node.children.sort(function (a, b) { return (a.z || 0) - (b.z || 0); });
        node.z = zKey(el, cs);
        return finalize(node);
      } finally {
        cleanup();
      }
    }

    /** Backgrounds / borders of inline elements (<mark>, <code>, pills), one box per line. */
    async function inlineBoxes(el, cs) {
      const out = [];
      for (const r of Array.prototype.slice.call(el.getClientRects())) {
        if (r.width < 0.5 || r.height < 0.5) continue;
        const box = rectOf(r);
        const b = readBorders(cs, box);
        out.push({
          type: 'frame', name: layerName(el), x: box.x, y: box.y, w: box.w, h: box.h, fills: await backgroundPaints(el, cs, box),
          stroke: b && b.stroke, radius: readRadii(cs, box.w, box.h), effects: parseShadows(cs.boxShadow, true), children: []
        });
      }
      return out;
    }

    function atomicSharesLine(seg) {
      if (!seg.atomics.length) return false;
      const tr = [];
      seg.items.forEach(function (it) { if (it.kind === 'text') tr.push.apply(tr, textRects(it.node)); });
      return seg.atomics.some(function (a) {
        const r = a.getBoundingClientRect();
        return tr.some(function (t) { return t.top < r.bottom && t.bottom > r.top; });
      });
    }

    /** Flattened tree: open shadow roots (web components) and slotted content. */
    function renderedChildren(n) {
      if (n.tagName === 'SLOT') {
        const assigned = n.assignedNodes({ flatten: true });
        if (assigned.length) return assigned;
      }
      return Array.prototype.slice.call((n.shadowRoot || n).childNodes);
    }

    /** Children in DOM order. Runs of inline content (text + inline elements) are
     *  grouped into segments and become rich text; everything else recurses. */
    async function serializeContent(el, cs, node, clipFill, deco) {
      const seq = [];
      const cleanups = [];
      let seg = null;
      const openSeg = function () {
        if (!seg) {
          seg = { items: [], atomics: [], decos: [], fragment: false };
          seq.push({ seg: seg });
        }
        return seg;
      };

      async function walk(parent, pcs, inh) {
        for (const child of renderedChildren(parent)) {
          if (child.nodeType === 3) {
            if (child.data && pcs.visibility !== 'hidden') openSeg().items.push({ kind: 'text', node: child, cs: pcs, style: runStyle(pcs, parent, inh) });
            continue;
          }
          if (child.nodeType !== 1) continue;
          const tag = child.tagName.toUpperCase();
          if (tag === 'BR') { openSeg().items.push({ kind: 'br', cs: pcs, style: runStyle(pcs, parent, inh) }); continue; }
          if (SKIP_TAGS.has(tag)) continue;
          const ccs = win.getComputedStyle(child);
          if (ccs.display === 'none') continue;
          if (ccs.display === 'contents') {
            cleanups.push(materializePseudos(child));
            await walk(child, ccs, { deco: decoLine(ccs) || inh.deco, clip: inh.clip });
            continue;
          }
          if (ccs.position === 'absolute' || ccs.position === 'fixed') { seq.push({ el: child, deco: null }); continue; }
          if (ccs.float !== 'none') {
            const s = openSeg();
            s.fragment = true;
            s.items.push({ kind: 'break' });
            seq.push({ el: child, deco: null });
            continue;
          }
          if (ccs.display === 'inline' && !REPLACED.has(tag) && tag !== 'BUTTON') {
            cleanups.push(materializePseudos(child));
            const s = openSeg();
            const clipped = isClipText(ccs);
            if (!clipped && hasBoxLook(ccs)) s.decos.push({ el: child, cs: ccs });
            // Horizontal padding/border/margin push the following words along;
            // rich text reproduces that with extra letter-spacing (a "pad").
            const next = { deco: decoLine(ccs) || inh.deco, clip: inh.clip };
            const start = px(ccs.marginLeft) + px(ccs.borderLeftWidth) + px(ccs.paddingLeft);
            const end = px(ccs.paddingRight) + px(ccs.borderRightWidth) + px(ccs.marginRight);
            if (Math.abs(start) > 0.01) s.items.push({ kind: 'pad', px: start, el: child, start: true, margin: px(ccs.marginLeft), style: runStyle(ccs, child, next) });
            if (clipped) {
              const b = boundsOf(child.getClientRects());
              next.clip = { fills: await backgroundPaints(child, ccs, b), box: b };
            }
            await walk(child, ccs, next);
            if (Math.abs(end) > 0.01) s.items.push({ kind: 'pad', px: end, el: child, start: false, margin: px(ccs.marginRight), style: runStyle(ccs, child, next) });
            continue;
          }
          if (/^inline/.test(ccs.display)) {
            const s = openSeg();
            s.atomics.push(child);
            s.items.push({ kind: 'break' });
            seq.push({ el: child, deco: null });
            continue;
          }
          seg = null; // block-level child ends the line box run
          seq.push({ el: child, deco: inh.deco });
        }
      }

      await walk(el, cs, { deco: deco, clip: clipFill });

      for (const entry of seq) {
        if (entry.el) {
          const c = await serializeElement(entry.el, entry.deco);
          if (c) node.children.push(c);
          continue;
        }
        const s = entry.seg;
        for (const d of s.decos) node.children.push.apply(node.children, await inlineBoxes(d.el, d.cs));
        if (!s.items.some(function (it) { return it.kind === 'text' && /\S/.test(it.node.data); })) continue;
        if (isIconSeg(s)) {
          const icon = iconNode(s);
          if (icon) node.children.push(icon);
          continue;
        }
        const rich = s.fragment || atomicSharesLine(s) ? 'split' : richText(s, el, cs, seq.length === 1);
        (rich === 'split' ? fragmentTexts(s, cs) : [rich]).forEach(function (t) { if (t) node.children.push(t); });
      }
      cleanups.reverse().forEach(function (f) { f(); });
    }

    // -------------------------------------------------------------------------
    // Page loading
    // -------------------------------------------------------------------------

    // Runs before page scripts: report every observed element as on screen so
    // scroll-reveal / lazy-load code renders content below the fold.
    const BOOTSTRAP = '<script>(function(){window.IntersectionObserver=function(cb){var o=this;o.root=null;o.rootMargin="0px";' +
      'o.thresholds=[0];o.observe=function(t){setTimeout(function(){var r=t.getBoundingClientRect();cb([{target:t,isIntersecting:true,' +
      'intersectionRatio:1,boundingClientRect:r,intersectionRect:r,rootBounds:null,time:performance.now()}],o)},0)};' +
      'o.unobserve=o.disconnect=function(){};o.takeRecords=function(){return[]}};})();<\/script>';

    function injectBootstrap(src) {
      const m = src.match(/<head[^>]*>/i) || src.match(/<html[^>]*>/i);
      return m ? src.slice(0, m.index + m[0].length) + BOOTSTRAP + src.slice(m.index + m[0].length) : BOOTSTRAP + src;
    }

    function waitForIframeLoad(iframe) {
      return new Promise(function (resolve) {
        // Slow third-party assets shouldn't block the import: measure what's there.
        const timeout = setTimeout(resolve, 15000);
        iframe.onload = function () {
          clearTimeout(timeout);
          resolve();
        };
      });
    }

    async function waitForPageAssets() {
      const images = Array.prototype.slice.call(doc.images || []);
      images.forEach(function (img) { if (img.loading === 'lazy') img.loading = 'eager'; });
      await Promise.race([
        Promise.all(images.map(function (img) {
          if (img.complete) return null;
          return new Promise(function (resolve) {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          });
        })),
        sleep(8000)
      ]);
      if (doc.fonts && doc.fonts.ready) await Promise.race([doc.fonts.ready, sleep(5000)]);
    }

    /** Wait for a JS-rendered page to stop mutating the DOM (capped). */
    function waitForDomToSettle() {
      return new Promise(function (resolve) {
        let quietTimer = null;
        const hardTimer = setTimeout(finish, 8000);
        const observer = new MutationObserver(function () {
          clearTimeout(quietTimer);
          quietTimer = setTimeout(finish, 400);
        });
        function finish() {
          clearTimeout(hardTimer);
          clearTimeout(quietTimer);
          observer.disconnect();
          resolve();
        }
        observer.observe(doc.documentElement, { childList: true, subtree: true, attributes: true });
        quietTimer = setTimeout(finish, 400);
      });
    }

    /** Snap animations to their settled state and stop timers, so the capture is stable. */
    function freezePage() {
      try {
        doc.querySelectorAll('[data-aos]').forEach(function (el) { el.classList.add('aos-animate'); }); // AOS reveal
        if (win.ScrollTrigger) win.ScrollTrigger.getAll().forEach(function (t) { if (t.animation) t.animation.progress(1); });
        if (win.gsap) win.gsap.globalTimeline.progress(1);
      } catch (e) { /* page libraries are optional */ }
      void doc.body.offsetHeight; // start transitions triggered above so they can be finished too
      (doc.getAnimations ? doc.getAnimations() : []).forEach(function (a) {
        try {
          const end = a.effect && a.effect.getComputedTiming().endTime;
          if (isFinite(end)) a.finish(); // entrance effects end visible
          else { a.pause(); a.currentTime = 0; } // loops rest on their first frame
        } catch (e) { /* ignore */ }
      });
      try {
        const lastTimer = win.setTimeout(function () {}, 0);
        for (let i = 0; i <= lastTimer; i++) { win.clearTimeout(i); win.clearInterval(i); }
        const lastFrame = win.requestAnimationFrame(function () {});
        for (let i = 0; i <= lastFrame; i++) win.cancelAnimationFrame(i);
      } catch (e) { /* scripts disabled */ }
    }

    /** Render the source in a real isolated document at the viewport size and measure it. */
    async function captureHtmlTree(html, opts) {
      imageStore = {};
      imageSeq = 0;
      imageLoads = new Map();
      fontCheck = new Map();
      fontProbe = null;
      renderHost.innerHTML = '';

      // Scripts stay stripped and the iframe stays script-less by default: a
      // sandbox that both runs scripts and shares origin (needed to read the
      // rendered DOM back out) can reach into this UI page. Only relax it when
      // the user opts in for a page that renders its content via JS.
      let source = opts.runScripts ? html : html.replace(/<script\b[\s\S]*?<\/script>/gi, '');
      if (!/<html[\s>]/i.test(source)) {
        source = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + source + '</body></html>';
      }
      if (opts.runScripts) source = injectBootstrap(source);

      // The iframe is a real viewport (so 100vh, media queries and fixed
      // elements match a browser window). It stays in the plugin viewport at
      // opacity 0: off-screen iframes get throttled inside Figma.
      renderHost.style.width = Math.min(opts.width, 360) + 'px';
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', opts.runScripts ? 'allow-same-origin allow-scripts' : 'allow-same-origin');
      iframe.setAttribute('scrolling', 'no');
      iframe.style.cssText = 'display:block;border:0;width:' + opts.width + 'px;height:' + opts.height + 'px;opacity:0;pointer-events:none;';
      renderHost.appendChild(iframe);

      setStatus('Loading page assets…');
      try {
        const loaded = waitForIframeLoad(iframe);
        iframe.srcdoc = source;
        await loaded;
        doc = iframe.contentDocument;
        win = iframe.contentWindow;
        if (!doc || !win || !doc.body) throw new Error('Could not access the HTML preview.');
        const style = doc.createElement('style');
        style.textContent = '[data-h2f~="b"]::before{content:none!important}[data-h2f~="a"]::after{content:none!important}';
        (doc.head || doc.documentElement).appendChild(style);
        if (opts.runScripts) {
          setStatus('Running page scripts…');
          await waitForDomToSettle();
        }
        await waitForPageAssets();
        // ponytail: fixed wait for canvas chart intro animations (Chart.js ≈ 1s); hook the library if it needs more.
        if (opts.runScripts && doc.querySelector('canvas')) await sleep(1200);
        freezePage();
        await sleep(50);
        win.scrollTo(0, 0);
        setStatus('Measuring layout…');
        return await serializePage(opts);
      } finally {
        renderHost.innerHTML = '';
        renderHost.style.width = '1px';
        doc = null;
        win = null;
      }
    }

    async function serializePage(opts) {
      const root = doc.documentElement, body = doc.body;
      const hcs = win.getComputedStyle(root), bcs = win.getComputedStyle(body);
      const w = opts.width;
      const h = Math.ceil(Math.max(root.scrollHeight, body.scrollHeight, opts.height));
      // The canvas background comes from <html>, or from <body> when <html> has none.
      bodyBgOnCanvas = !parseColor(hcs.backgroundColor) && hcs.backgroundImage === 'none';
      const fills = await backgroundPaints(bodyBgOnCanvas ? body : root, bodyBgOnCanvas ? bcs : hcs, { x: 0, y: 0, w: w, h: h });
      if (!(fills[0] && fills[0].type === 'SOLID' && fills[0].color.a > 0.999)) fills.unshift(solidPaint({ r: 1, g: 1, b: 1, a: 1 }));
      const bodyNode = await serializeElement(body, null);
      if (!bodyNode) {
        throw new Error('Layout measured an empty page. Try again, or paste a full HTML document with inline CSS.');
      }
      return { type: 'frame', name: 'Page', x: 0, y: 0, w: w, h: h, fills: fills, effects: [], clip: true, children: [bodyNode] };
    }

    convertBtn.addEventListener('click', async function () {
      if (isImporting) return;
      const html = htmlInput.value.trim();
      if (!html) {
        setStatus('Choose an HTML file to import, or paste HTML below.', 'error');
        fileInput.click();
        return;
      }

      const opts = { width: viewport.w, height: viewport.h, runScripts: runScriptsInput.checked };
      scriptsSkipped = !opts.runScripts && /<script\b/i.test(html);
      setImporting(true, 'Rendering page…');
      setStatus('Rendering at ' + opts.width + ' × ' + opts.height + '…');

      try {
        const page = await inlineAssets(html, assetFiles);
        const tree = await withTimeout(captureHtmlTree(page, opts), 90000, 'Render');
        setImporting(true, 'Creating Figma layers…');
        setStatus('Importing…');
        parent.postMessage({
          pluginMessage: {
            type: 'convert',
            tree: tree,
            images: imageStore,
            viewportWidth: opts.width,
            asComponent: asComponentInput.checked
          }
        }, '*');
        importTimeout = setTimeout(function () {
          setImporting(false);
          setStatus(
            'Figma did not finish the import. Try a smaller self-contained HTML file, then run the plugin again.',
            'error'
          );
        }, 120000);
      } catch (err) {
        renderHost.innerHTML = '';
        setStatus(err && err.message ? err.message : String(err), 'error');
        setImporting(false);
      }
    });

    onmessage = function (event) {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || msg.type === 'convert') return;
      setImporting(false);
      if (msg.type === 'done') {
        let text = 'Imported · ' + msg.count + ' layers' + (msg.styles ? ' · ' + msg.styles + ' colors' : '');
        if (msg.missingFonts && msg.missingFonts.length) {
          text += '\nNot in Figma (substituted): ' + msg.missingFonts.slice(0, 6).join(', ');
        }
        if (scriptsSkipped) text += '\nThis page has scripts. If something is missing, tick “Execute page scripts”.';
        setStatus(text, 'ok');
      } else if (msg.type === 'error') {
        setStatus(msg.message, 'error');
      }
    };

    const mochi = document.querySelector('.mochi');

    // Glass rim light follows the pointer, and the mouse looks at it.
    addEventListener('pointermove', function (e) {
      document.documentElement.style.setProperty('--mx', e.clientX + 'px');
      document.documentElement.style.setProperty('--my', e.clientY + 'px');
      const r = mochi.getBoundingClientRect();
      const dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height * 0.54; // eye line
      const k = Math.min(1, Math.hypot(dx, dy) / 150) / (Math.hypot(dx, dy) || 1);
      mochi.style.setProperty('--lx', (dx * k * 20).toFixed(1) + 'px');
      mochi.style.setProperty('--ly', (dy * k * 14).toFixed(1) + 'px');
    });

    // Boop the mouse: it squishes, squints and blushes.
    mochi.addEventListener('pointerdown', function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const t = { duration: 600, easing: 'ease-out' };
      mochi.animate({ scale: ['1', '1.12 0.86', '0.95 1.06', '1'] }, t);
      mochi.querySelector('.eyes').animate({ opacity: [0, 0] }, t);
      mochi.querySelector('.happy').animate({ opacity: [1, 1] }, t);
      mochi.querySelectorAll('.cheeks circle').forEach(function (c) {
        c.animate({ scale: [1, 1.3, 1], fill: ['#ff8fb3', '#ff5f97', '#ff8fb3'] }, t);
      });
    });
  </script>
</body>
</html>
