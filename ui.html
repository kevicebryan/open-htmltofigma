<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Open HTML to Figma</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f7f6f3;
      --ink: #37352f;
      --muted: #787774;
      --faint: #9b9a97;
      --line: #e9e9e7;
      --line-strong: #d3d1cb;
      --hover: #efeee9;
      --accent: #2383e2;
      --ok: #0f7b6c;
      --ok-bg: #edf3f1;
      --err: #e03e3e;
      --err-bg: #fdebec;
      --radius: 6px;
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px 16px 14px;
      font: 13px/1.5 var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .field {
      margin-bottom: 14px;
    }

    .field-label {
      display: block;
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    .field-label .link {
      margin-left: 4px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--accent);
      font: inherit;
      cursor: pointer;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .option input {
      margin: 0;
      accent-color: var(--accent);
    }

    /* Notion-like segmented control */
    .segment {
      display: flex;
      padding: 3px;
      gap: 2px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .segment button {
      flex: 1;
      margin: 0;
      padding: 6px 4px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font: 500 11.5px/1.2 var(--font);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .segment button:hover {
      color: var(--ink);
      background: rgba(55, 53, 47, 0.04);
    }

    .segment button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.06), 0 0 0 1px rgba(15, 15, 15, 0.04);
    }

    /* File dropzone */
    .file-zone {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      background: var(--bg-soft);
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
    }

    .file-zone:hover {
      border-color: var(--muted);
      background: var(--hover);
    }

    .file-zone.has-file {
      border-style: solid;
      border-color: var(--line);
      background: #fff;
    }

    .file-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .file-meta {
      min-width: 0;
      flex: 1;
    }

    .file-meta .title {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta .desc {
      font-size: 11.5px;
      color: var(--faint);
      margin-top: 1px;
    }

    textarea {
      width: 100%;
      height: 128px;
      resize: vertical;
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      font: 12px/1.45 var(--mono);
      outline: none;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    textarea::placeholder {
      color: var(--faint);
    }

    textarea:hover {
      background: #fcfcfb;
    }

    textarea:focus {
      border-color: rgba(35, 131, 226, 0.55);
      box-shadow: 0 0 0 2px rgba(35, 131, 226, 0.15);
      background: #fff;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 0 14px;
      color: var(--faint);
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .primary {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
      font: 500 13px/1.3 var(--font);
      cursor: pointer;
      transition: opacity 0.12s ease, background 0.12s ease;
    }

    .primary:hover:not(:disabled) {
      background: #2f2d28;
    }

    .primary:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .primary.loading {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      display: none;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .primary.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      padding: 8px 10px;
      min-height: 0;
      border-radius: var(--radius);
      background: var(--bg-soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #status.ok {
      background: var(--ok-bg);
      color: var(--ok);
    }

    #status.error {
      background: var(--err-bg);
      color: var(--err);
    }

    .hint {
      margin: 0;
      font-size: 11.5px;
      color: var(--faint);
      line-height: 1.4;
    }

    .credit {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--faint);
      line-height: 1.4;
      text-align: center;
    }

    .credit a {
      color: var(--muted);
      text-decoration: none;
    }

    .credit a:hover {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .hint a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .hint a:hover {
      color: var(--ink);
    }

    /* Keep the measure iframe in-viewport. Off-screen / visibility:hidden
       iframes are often throttled inside Figma's plugin UI, which yields
       empty or collapsed layout measurements. */
    #render-host {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Open HTML to Figma</h1>
    <p>Import a local HTML file as nested layers.</p>
  </div>

  <div class="field">
    <span class="field-label">Viewport</span>
    <div class="segment" id="viewports">
      <button type="button" data-w="1440" data-h="1024" class="active">Desktop</button>
      <button type="button" data-w="1280" data-h="832">Laptop</button>
      <button type="button" data-w="768" data-h="1024">Tablet</button>
      <button type="button" data-w="390" data-h="844">Mobile</button>
    </div>
  </div>

  <div class="field">
    <label class="option">
      <input id="as-component" type="checkbox" />
      Create the imported desktop as a component
    </label>
  </div>

  <div class="field">
    <label class="option">
      <input id="run-scripts" type="checkbox" />
      Execute page scripts (needed for JS-rendered pages)
    </label>
  </div>

  <div class="field">
    <span class="field-label">File <button type="button" class="link" id="pick-folder">or pick its folder</button></span>
    <label class="file-zone" id="file-zone" for="file">
      <input id="file" type="file" multiple accept=".html,.htm,text/html,.css,.js,.svg,image/*,.woff,.woff2,.ttf,.otf" />
      <div class="file-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3.5 2.5h6l3 3V13.5h-9v-11z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          <path d="M9.5 2.5V5.5H12.5" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="file-meta">
        <div class="title" id="file-title">Choose HTML file</div>
        <div class="desc" id="file-desc">.html, plus its CSS / images if local</div>
      </div>
    </label>
    <input id="folder" type="file" webkitdirectory hidden />
  </div>

  <div class="divider">or paste</div>

  <div class="field">
    <span class="field-label">HTML</span>
    <textarea id="html" placeholder="Paste your HTML here…" spellcheck="false"></textarea>
  </div>

  <div class="actions">
    <button class="primary" id="convert" type="button">
      <span class="spinner" aria-hidden="true"></span>
      <span id="convert-label">Import to Figma</span>
    </button>
    <div id="status">Ready</div>
    <p class="hint">Install page fonts in Figma for the closest match.</p>
    <p class="credit">Vibe coded by <a href="https://kevbry.in" target="_blank" rel="noopener noreferrer">Kevin</a></p>
  </div>

  <!-- Isolated browser document used for layout measurement. -->
  <div id="render-host" aria-hidden="true"></div>


  <script>
    const fileInput = document.getElementById('file');
    const fileZone = document.getElementById('file-zone');
    const fileTitle = document.getElementById('file-title');
    const fileDesc = document.getElementById('file-desc');
    const htmlInput = document.getElementById('html');
    const convertBtn = document.getElementById('convert');
    const convertLabel = document.getElementById('convert-label');
    const statusEl = document.getElementById('status');
    const renderHost = document.getElementById('render-host');
    const viewportBtns = document.querySelectorAll('#viewports button');
    const asComponentInput = document.getElementById('as-component');
    const runScriptsInput = document.getElementById('run-scripts');
    const folderInput = document.getElementById('folder');
    let assetFiles = []; // local CSS / JS / images / fonts picked with the page

    let viewport = { w: 1440, h: 1024 };
    let isImporting = false;
    let importTimeout = null;
    let scriptsSkipped = false;

    viewportBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        viewportBtns.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        viewport = { w: parseInt(btn.getAttribute('data-w'), 10), h: parseInt(btn.getAttribute('data-h'), 10) };
      });
    });

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind || '';
    }

    function setImporting(importing, label) {
      isImporting = importing;
      convertBtn.disabled = importing;
      convertBtn.classList.toggle('loading', importing);
      convertLabel.textContent = label || (importing ? 'Importing…' : 'Import to Figma');
      if (!importing && importTimeout) {
        clearTimeout(importTimeout);
        importTimeout = null;
      }
    }

    function isHtmlFile(file) {
      if (!file) return false;
      return /\.(html?|xhtml)$/i.test(file.name) ||
        file.type === 'text/html' ||
        file.type === 'application/xhtml+xml';
    }

    function resetFilePicker() {
      fileInput.value = '';
      folderInput.value = '';
      assetFiles = [];
      fileZone.classList.remove('has-file');
      fileTitle.textContent = 'Choose HTML file';
      fileDesc.textContent = '.html, plus its CSS / images if local';
    }

    function withTimeout(promise, ms, label) {
      return Promise.race([
        promise,
        new Promise(function (_, reject) {
          setTimeout(function () {
            reject(new Error((label || 'Operation') + ' timed out'));
          }, ms);
        })
      ]);
    }

    /** The page is the (shallowest, preferably index) HTML file; the rest are its assets. */
    async function loadPicked(files) {
      const list = Array.prototype.slice.call(files || []);
      if (!list.length) return;
      const path = function (f) { return f.webkitRelativePath || f.name; };
      const page = list.filter(isHtmlFile).sort(function (a, b) {
        return /(^|\/)index\.html?$/i.test(path(b)) - /(^|\/)index\.html?$/i.test(path(a)) ||
          path(a).split('/').length - path(b).split('/').length;
      })[0];
      if (!page) {
        resetFilePicker();
        setStatus('Choose an HTML file (.html or .htm). "' + list[0].name + '" is not supported.', 'error');
        return;
      }
      try {
        htmlInput.value = await page.text();
        assetFiles = list.filter(function (f) { return f !== page; });
        fileZone.classList.add('has-file');
        fileTitle.textContent = page.name;
        fileDesc.textContent = Math.max(1, Math.round(page.size / 1024)) + ' KB loaded' +
          (assetFiles.length ? ' · ' + assetFiles.length + ' local asset' + (assetFiles.length > 1 ? 's' : '') : '');
        setStatus('File loaded — ready to import');
      } catch (err) {
        resetFilePicker();
        setStatus('Failed to read file: ' + err.message, 'error');
      }
    }

    fileInput.addEventListener('change', function () { loadPicked(fileInput.files); });
    folderInput.addEventListener('change', function () { loadPicked(folderInput.files); });
    document.getElementById('pick-folder').addEventListener('click', function () { folderInput.click(); });

    async function replaceAsync(str, re, fn) {
      const parts = [];
      let last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(str))) {
        parts.push(str.slice(last, m.index), fn.apply(null, m));
        last = m.index + m[0].length;
      }
      parts.push(str.slice(last));
      return (await Promise.all(parts)).join('');
    }

    /** Relative refs (style.css, img/hero.jpg, fonts) → inline / data: URLs from the picked files,
     *  since the page renders from a string and has no folder to resolve them against. */
    async function inlineAssets(html, files) {
      if (!files.length) return html;
      const entries = files.map(function (f) { return { f: f, path: (f.webkitRelativePath || f.name).toLowerCase() }; });
      const find = function (ref) {
        if (!ref || /^(https?:|data:|blob:|mailto:|#|\/\/)/i.test(ref.trim())) return null;
        let p;
        try { p = decodeURIComponent(ref.trim().split(/[?#]/)[0]); } catch (e) { p = ref.trim(); }
        p = p.toLowerCase().replace(/^(\.\.?\/)+|^\//g, '');
        const base = p.split('/').pop();
        const hit = entries.find(function (e) { return e.path === p || e.path.endsWith('/' + p); }) ||
          entries.find(function (e) { return e.path.split('/').pop() === base; }); // ponytail: basename fallback
        return hit ? hit.f : null;
      };
      const cache = new Map();
      const dataUrl = function (f) {
        if (!cache.has(f)) cache.set(f, new Promise(function (resolve) {
          const reader = new FileReader();
          reader.onload = function () { resolve(reader.result); };
          reader.readAsDataURL(f);
        }));
        return cache.get(f);
      };
      const css = function (text) {
        return replaceAsync(text, /url\(\s*(['"]?)([^'")]+)\1\s*\)/g, async function (m, q, ref) {
          const f = find(ref);
          return f ? 'url("' + await dataUrl(f) + '")' : m;
        });
      };
      const d = new DOMParser().parseFromString(html, 'text/html');
      const all = function (sel) { return Array.prototype.slice.call(d.querySelectorAll(sel)); };
      for (const link of all('link[rel~="stylesheet"][href]')) {
        const f = find(link.getAttribute('href'));
        if (!f) continue;
        const style = d.createElement('style');
        style.textContent = await css(await f.text()); // ponytail: @import inside it isn't followed
        link.replaceWith(style);
      }
      for (const el of all('style')) el.textContent = await css(el.textContent);
      for (const el of all('[style]')) el.setAttribute('style', await css(el.getAttribute('style')));
      for (const el of all('script[src]')) {
        const f = find(el.getAttribute('src'));
        if (f) { el.removeAttribute('src'); el.textContent = await f.text(); }
      }
      for (const el of all('[src], [poster], object[data]')) {
        for (const a of ['src', 'poster', 'data']) {
          const f = el.hasAttribute(a) && find(el.getAttribute(a));
          if (f) el.setAttribute(a, await dataUrl(f));
        }
      }
      for (const el of all('[srcset]')) {
        const f = find(el.getAttribute('srcset').trim().split(/\s+/)[0]);
        if (f) el.setAttribute('srcset', await dataUrl(f));
      }
      return (d.doctype ? '<!DOCTYPE html>\n' : '') + d.documentElement.outerHTML;
    }

    // =========================================================================
    // Capture: render the HTML in an isolated iframe and measure what the
    // browser actually drew. Geometry is in page px; paints are Figma-ready.
    // =========================================================================

    let doc = null;             // render iframe document / window (one import at a time)
    let win = null;
    let imageStore = {};        // id -> raw base64 PNG/JPEG
    let imageSeq = 0;
    let imageLoads = new Map(); // url -> Promise<HTMLImageElement | null>
    let fontCheck = new Map();  // family -> did the browser have it?
    let fontProbe = null;
    let bodyBgOnCanvas = false; // body background is painted by the root frame

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const SIDES = ['Top', 'Right', 'Bottom', 'Left'];
    const BLACK = { r: 0, g: 0, b: 0, a: 1 };
    const ACCENT = { r: 0, g: 0.459, b: 1, a: 1 }; // Chrome's default accent-color
    const SKIP_TAGS = new Set(['SCRIPT', 'STYLE', 'LINK', 'META', 'NOSCRIPT', 'HEAD', 'TITLE', 'TEMPLATE',
      'BR', 'WBR', 'SOURCE', 'TRACK', 'PARAM', 'MAP', 'AREA', 'DATALIST', 'OPTION', 'OPTGROUP']);
    // Drawn from their own pixels / value; children are not walked.
    const REPLACED = new Set(['IMG', 'SVG', 'VIDEO', 'CANVAS', 'IFRAME', 'EMBED', 'OBJECT', 'AUDIO',
      'INPUT', 'SELECT', 'TEXTAREA', 'PROGRESS', 'METER']);

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    function px(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
    function rectOf(r) { return { x: r.left, y: r.top, w: r.width, h: r.height }; }

    function boundsOf(rects) {
      let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
      Array.prototype.forEach.call(rects, function (q) {
        l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom);
      });
      return l === Infinity ? { x: 0, y: 0, w: 0, h: 0 } : { x: l, y: t, w: r - l, h: b - t };
    }

    function contentBox(el, cs) {
      const r = el.getBoundingClientRect();
      const l = px(cs.borderLeftWidth) + px(cs.paddingLeft);
      const t = px(cs.borderTopWidth) + px(cs.paddingTop);
      return {
        x: r.left + l,
        y: r.top + t,
        w: r.width - l - px(cs.borderRightWidth) - px(cs.paddingRight),
        h: r.height - t - px(cs.borderBottomWidth) - px(cs.paddingBottom)
      };
    }

    // -------------------------------------------------------------------------
    // CSS value parsing
    // -------------------------------------------------------------------------

    /** Split on `sep` outside parentheses and quotes (sep ' ' = any whitespace). */
    function splitTopLevel(str, sep) {
      const out = [];
      let cur = '', depth = 0, quote = '';
      for (const ch of String(str || '')) {
        if (quote) { if (ch === quote) quote = ''; }
        else if (ch === '"' || ch === "'") quote = ch;
        else if (ch === '(') depth++;
        else if (ch === ')') depth--;
        else if (depth === 0 && (sep === ' ' ? /\s/.test(ch) : ch === sep)) {
          if (cur.trim()) out.push(cur.trim());
          cur = '';
          continue;
        }
        cur += ch;
      }
      if (cur.trim()) out.push(cur.trim());
      return out;
    }

    /** Top-level function calls: "blur(4px) drop-shadow(…)" → [{name, args}]. */
    function cssFunctions(str) {
      const out = [];
      const s = String(str || '');
      const re = /([a-z-]+)\(/gi;
      let m;
      while ((m = re.exec(s))) {
        let depth = 1, quote = '', j = m.index + m[0].length;
        for (; j < s.length && depth; j++) {
          const ch = s[j];
          if (quote) { if (ch === quote) quote = ''; }
          else if (ch === '"' || ch === "'") quote = ch;
          else if (ch === '(') depth++;
          else if (ch === ')') depth--;
        }
        out.push({ name: m[1].toLowerCase(), args: s.slice(m.index + m[0].length, j - 1) });
        re.lastIndex = j;
      }
      return out;
    }

    /** Computed length / percentage / keyword / simple calc(% ± px) → px, % of `basis`. */
    function lenPx(tok, basis) {
      const t = String(tok || '').trim();
      const kw = { left: 0, top: 0, center: 50, right: 100, bottom: 100 }[t];
      if (kw !== undefined) return basis * kw / 100;
      let v = 0;
      (t.replace(/^calc\(/, '').match(/[-+]?\s*[\d.]+(?:e[-+]?\d+)?%?/gi) || []).forEach(function (term) {
        const n = parseFloat(term.replace(/\s+/g, ''));
        v += /%$/.test(term) ? basis * n / 100 : n;
      });
      return v;
    }

    /** background-position / object-position axis: offset of an item inside `free` space. */
    function posOffset(tok, free) {
      const m = String(tok || '').trim().match(/^(left|right|top|bottom|center)\s+(.+)$/);
      if (!m) return lenPx(tok, free);
      const off = lenPx(m[2], free);
      return m[1] === 'right' || m[1] === 'bottom' ? free - off : off;
    }

    function angleDeg(tok) {
      const m = String(tok || '').trim().match(/^(-?[\d.]+)(deg|rad|turn|grad)?$/);
      if (!m) return 0;
      const v = parseFloat(m[1]);
      return m[2] === 'rad' ? v * 180 / Math.PI : m[2] === 'turn' ? v * 360 : m[2] === 'grad' ? v * 0.9 : v;
    }

    /** Any CSS color → {r,g,b,a} in 0–1. Fully transparent → null unless keepClear. */

      // Measure the untransformed box; Figma re-applies the rotation / scale exactly.
      const saved = el.getAttribute('style');
      ['transform', 'rotate', 'scale', 'translate', 'transition'].forEach(function (p) { el.style.setProperty(p, 'none', 'important'); });
      try {
        return await serializeBox(el, cs, tag, tf, deco);
      } finally {
        if (saved === null) el.removeAttribute('style');
        else el.setAttribute('style', saved);
      }
    }

    async function serializeBox(el, cs, tag, tf, deco) {
      if (!el.getClientRects().length) return null; // not rendered (closed <details>…)
      const r0 = el.getBoundingClientRect();
      if (r0.width <= 1.5 && r0.height <= 1.5 && (cs.overflowX !== 'visible' || cs.clip !== 'auto')) return null; // sr-only
      if (cs.clipPath === 'inset(50%)') return null;
      const cleanup = REPLACED.has(tag) ? function () {} : materializePseudos(el);
      try {
        const box = rectOf(el.getBoundingClientRect());
        const node = { type: 'frame', name: layerName(el), x: box.x, y: box.y, w: box.w, h: box.h, fills: [], effects: [], children: [] };
        const isBody = el === doc.body;
        let clipFill = null;
        if (cs.visibility !== 'hidden') {
          const bg = isBody && bodyBgOnCanvas ? [] : await backgroundPaints(el, cs, box);
          if (isClipText(cs)) clipFill = { fills: bg, box: box };
          else node.fills = bg;
          const b = readBorders(cs, box);
          if (b && b.stroke) node.stroke = b.stroke;
          else if (b) node.children.push({ type: 'svg', name: 'border', x: box.x, y: box.y, w: box.w, h: box.h, svg: b.svg, z: -1e9 });
          node.radius = readRadii(cs, box.w, box.h);
          node.effects = readEffects(cs, REPLACED.has(tag));
        }
        const op = parseFloat(cs.opacity);
        if (op < 1) node.opacity = op;
        if (cs.mixBlendMode && cs.mixBlendMode !== 'normal') node.blend = cs.mixBlendMode.toUpperCase().replace(/-/g, '_');
        node.clip = !isBody && (cs.overflowX !== 'visible' || cs.overflowY !== 'visible' || /^(INPUT|SELECT|TEXTAREA)$/.test(tag));
        if (tf) node.transform = tf;

        if (tag === 'SVG') {
          if (box.w < 0.5 || box.h < 0.5) return null;
          const markup = svgMarkup(el, box.w, box.h);
          if (/<foreignObject/i.test(markup)) { // HTML inside SVG: Figma can't import it, raster instead
            node.fills = [imagePaintOrNull(await drawUrl('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup), box.w, box.h))].filter(Boolean);
            node.z = zKey(el, cs);
            return finalize(node);
          }
          return {
            type: 'svg', name: el.getAttribute('aria-label') || 'svg', x: box.x, y: box.y, w: box.w, h: box.h, svg: markup,
            opacity: node.opacity, blend: node.blend, effects: node.effects, transform: node.transform,
            clip: cs.overflowX !== 'visible', z: zKey(el, cs)
          };
        }
        if (tag === 'IMG') await imgContent(el, cs, node, box);
        else if (tag === 'CANVAS' || tag === 'VIDEO') await mediaContent(el, cs, node, box, tag);
        else if (/^(IFRAME|EMBED|OBJECT|AUDIO)$/.test(tag)) node.fills.push(solidPaint({ r: 0.94, g: 0.94, b: 0.94, a: 1 }));
        else if (REPLACED.has(tag)) formControl(el, cs, node, box, tag);
        else await serializeContent(el, cs, node, clipFill, decoLine(cs) || deco);
        if (cs.visibility !== 'hidden') listMarker(el, cs, node);
        node.children.sort(function (a, b) { return (a.z || 0) - (b.z || 0); });
        node.z = zKey(el, cs);
        return finalize(node);
      } finally {
        cleanup();
      }
    }

    /** Backgrounds / borders of inline elements (<mark>, <code>, pills), one box per line. */
    async function inlineBoxes(el, cs) {
      const out = [];
      for (const r of Array.prototype.slice.call(el.getClientRects())) {
        if (r.width < 0.5 || r.height < 0.5) continue;
        const box = rectOf(r);
        const b = readBorders(cs, box);
        out.push({
          type: 'frame', name: layerName(el), x: box.x, y: box.y, w: box.w, h: box.h, fills: await backgroundPaints(el, cs, box),
          stroke: b && b.stroke, radius: readRadii(cs, box.w, box.h), effects: parseShadows(cs.boxShadow, true), children: []
        });
      }
      return out;
    }

    function atomicSharesLine(seg) {
      if (!seg.atomics.length) return false;
      const tr = [];
      seg.items.forEach(function (it) { if (it.kind === 'text') tr.push.apply(tr, textRects(it.node)); });
      return seg.atomics.some(function (a) {
        const r = a.getBoundingClientRect();
        return tr.some(function (t) { return t.top < r.bottom && t.bottom > r.top; });
      });
    }

    /** Flattened tree: open shadow roots (web components) and slotted content. */
    function renderedChildren(n) {
      if (n.tagName === 'SLOT') {
        const assigned = n.assignedNodes({ flatten: true });
        if (assigned.length) return assigned;
      }
      return Array.prototype.slice.call((n.shadowRoot || n).childNodes);
    }

    /** Children in DOM order. Runs of inline content (text + inline elements) are
     *  grouped into segments and become rich text; everything else recurses. */
    async function serializeContent(el, cs, node, clipFill, deco) {
      const seq = [];
      const cleanups = [];
      let seg = null;
      const openSeg = function () {
        if (!seg) {
          seg = { items: [], atomics: [], decos: [], fragment: false };
          seq.push({ seg: seg });
        }
        return seg;
      };

      async function walk(parent, pcs, inh) {
        for (const child of renderedChildren(parent)) {
          if (child.nodeType === 3) {
            if (child.data && pcs.visibility !== 'hidden') openSeg().items.push({ kind: 'text', node: child, cs: pcs, style: runStyle(pcs, parent, inh) });
            continue;
          }
          if (child.nodeType !== 1) continue;
          const tag = child.tagName.toUpperCase();
          if (tag === 'BR') { openSeg().items.push({ kind: 'br', cs: pcs, style: runStyle(pcs, parent, inh) }); continue; }
          if (SKIP_TAGS.has(tag)) continue;
          const ccs = win.getComputedStyle(child);
          if (ccs.display === 'none') continue;
          if (ccs.display === 'contents') {
            cleanups.push(materializePseudos(child));
            await walk(child, ccs, { deco: decoLine(ccs) || inh.deco, clip: inh.clip });
            continue;
          }
          if (ccs.position === 'absolute' || ccs.position === 'fixed') { seq.push({ el: child, deco: null }); continue; }
          if (ccs.float !== 'none') {
            const s = openSeg();
            s.fragment = true;
            s.items.push({ kind: 'break' });
            seq.push({ el: child, deco: null });
            continue;
          }
          if (ccs.display === 'inline' && !REPLACED.has(tag) && tag !== 'BUTTON') {
            cleanups.push(materializePseudos(child));
            const s = openSeg();
            const clipped = isClipText(ccs);
            if (!clipped && hasBoxLook(ccs)) s.decos.push({ el: child, cs: ccs });
            // Horizontal padding/border/margin push the following words along;
            // rich text reproduces that with extra letter-spacing (a "pad").
            const next = { deco: decoLine(ccs) || inh.deco, clip: inh.clip };
            const start = px(ccs.marginLeft) + px(ccs.borderLeftWidth) + px(ccs.paddingLeft);
            const end = px(ccs.paddingRight) + px(ccs.borderRightWidth) + px(ccs.marginRight);
            if (Math.abs(start) > 0.01) s.items.push({ kind: 'pad', px: start, el: child, start: true, margin: px(ccs.marginLeft), style: runStyle(ccs, child, next) });
            if (clipped) {
              const b = boundsOf(child.getClientRects());
              next.clip = { fills: await backgroundPaints(child, ccs, b), box: b };
            }
            await walk(child, ccs, next);
            if (Math.abs(end) > 0.01) s.items.push({ kind: 'pad', px: end, el: child, start: false, margin: px(ccs.marginRight), style: runStyle(ccs, child, next) });
            continue;
          }
          if (/^inline/.test(ccs.display)) {
            const s = openSeg();
            s.atomics.push(child);
            s.items.push({ kind: 'break' });
            seq.push({ el: child, deco: null });
            continue;
          }
          seg = null; // block-level child ends the line box run
          seq.push({ el: child, deco: inh.deco });
        }
      }

      await walk(el, cs, { deco: deco, clip: clipFill });

      for (const entry of seq) {
        if (entry.el) {
          const c = await serializeElement(entry.el, entry.deco);
          if (c) node.children.push(c);
          continue;
        }
        const s = entry.seg;
        for (const d of s.decos) node.children.push.apply(node.children, await inlineBoxes(d.el, d.cs));
        if (!s.items.some(function (it) { return it.kind === 'text' && /\S/.test(it.node.data); })) continue;
        if (isIconSeg(s)) {
          const icon = iconNode(s);
          if (icon) node.children.push(icon);
          continue;
        }
        const rich = s.fragment || atomicSharesLine(s) ? 'split' : richText(s, el, cs, seq.length === 1);
        (rich === 'split' ? fragmentTexts(s, cs) : [rich]).forEach(function (t) { if (t) node.children.push(t); });
      }
      cleanups.reverse().forEach(function (f) { f(); });
    }

    // -------------------------------------------------------------------------
    // Page loading
    // -------------------------------------------------------------------------

    // Runs before page scripts: report every observed element as on screen so
    // scroll-reveal / lazy-load code renders content below the fold.
    const BOOTSTRAP = '<script>(function(){window.IntersectionObserver=function(cb){var o=this;o.root=null;o.rootMargin="0px";' +
      'o.thresholds=[0];o.observe=function(t){setTimeout(function(){var r=t.getBoundingClientRect();cb([{target:t,isIntersecting:true,' +
      'intersectionRatio:1,boundingClientRect:r,intersectionRect:r,rootBounds:null,time:performance.now()}],o)},0)};' +
      'o.unobserve=o.disconnect=function(){};o.takeRecords=function(){return[]}};})();<\/script>';

    function injectBootstrap(src) {
      const m = src.match(/<head[^>]*>/i) || src.match(/<html[^>]*>/i);
      return m ? src.slice(0, m.index + m[0].length) + BOOTSTRAP + src.slice(m.index + m[0].length) : BOOTSTRAP + src;
    }

    function waitForIframeLoad(iframe) {
      return new Promise(function (resolve) {
        // Slow third-party assets shouldn't block the import: measure what's there.
        const timeout = setTimeout(resolve, 15000);
        iframe.onload = function () {
          clearTimeout(timeout);
          resolve();
        };
      });
    }

    async function waitForPageAssets() {
      const images = Array.prototype.slice.call(doc.images || []);
      images.forEach(function (img) { if (img.loading === 'lazy') img.loading = 'eager'; });
      await Promise.race([
        Promise.all(images.map(function (img) {
          if (img.complete) return null;
          return new Promise(function (resolve) {
            img.addEventListener('load', resolve, { once: true });
            img.addEventListener('error', resolve, { once: true });
          });
        })),
        sleep(8000)
      ]);
      if (doc.fonts && doc.fonts.ready) await Promise.race([doc.fonts.ready, sleep(5000)]);
    }

    /** Wait for a JS-rendered page to stop mutating the DOM (capped). */
    function waitForDomToSettle() {
      return new Promise(function (resolve) {
        let quietTimer = null;
        const hardTimer = setTimeout(finish, 8000);
        const observer = new MutationObserver(function () {
          clearTimeout(quietTimer);
          quietTimer = setTimeout(finish, 400);
        });
        function finish() {
          clearTimeout(hardTimer);
          clearTimeout(quietTimer);
          observer.disconnect();
          resolve();
        }
        observer.observe(doc.documentElement, { childList: true, subtree: true, attributes: true });
        quietTimer = setTimeout(finish, 400);
      });
    }

    /** Snap animations to their settled state and stop timers, so the capture is stable. */
    function freezePage() {
      try {
        doc.querySelectorAll('[data-aos]').forEach(function (el) { el.classList.add('aos-animate'); }); // AOS reveal
        if (win.ScrollTrigger) win.ScrollTrigger.getAll().forEach(function (t) { if (t.animation) t.animation.progress(1); });
        if (win.gsap) win.gsap.globalTimeline.progress(1);
      } catch (e) { /* page libraries are optional */ }
      void doc.body.offsetHeight; // start transitions triggered above so they can be finished too
      (doc.getAnimations ? doc.getAnimations() : []).forEach(function (a) {
        try {
          const end = a.effect && a.effect.getComputedTiming().endTime;
          if (isFinite(end)) a.finish(); // entrance effects end visible
          else { a.pause(); a.currentTime = 0; } // loops rest on their first frame
        } catch (e) { /* ignore */ }
      });
      try {
        const lastTimer = win.setTimeout(function () {}, 0);
        for (let i = 0; i <= lastTimer; i++) { win.clearTimeout(i); win.clearInterval(i); }
        const lastFrame = win.requestAnimationFrame(function () {});
        for (let i = 0; i <= lastFrame; i++) win.cancelAnimationFrame(i);
      } catch (e) { /* scripts disabled */ }
    }

    /** Render the source in a real isolated document at the viewport size and measure it. */
    async function captureHtmlTree(html, opts) {
      imageStore = {};
      imageSeq = 0;
      imageLoads = new Map();
      fontCheck = new Map();
      fontProbe = null;
      renderHost.innerHTML = '';

      // Scripts stay stripped and the iframe stays script-less by default: a
      // sandbox that both runs scripts and shares origin (needed to read the
      // rendered DOM back out) can reach into this UI page. Only relax it when
      // the user opts in for a page that renders its content via JS.
      let source = opts.runScripts ? html : html.replace(/<script\b[\s\S]*?<\/script>/gi, '');
      if (!/<html[\s>]/i.test(source)) {
        source = '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + source + '</body></html>';
      }
      if (opts.runScripts) source = injectBootstrap(source);

      // The iframe is a real viewport (so 100vh, media queries and fixed
      // elements match a browser window). It stays in the plugin viewport at
      // opacity 0: off-screen iframes get throttled inside Figma.
      renderHost.style.width = Math.min(opts.width, 360) + 'px';
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', opts.runScripts ? 'allow-same-origin allow-scripts' : 'allow-same-origin');
      iframe.setAttribute('scrolling', 'no');
      iframe.style.cssText = 'display:block;border:0;width:' + opts.width + 'px;height:' + opts.height + 'px;opacity:0;pointer-events:none;';
      renderHost.appendChild(iframe);

      setStatus('Loading page assets…');
      try {
        const loaded = waitForIframeLoad(iframe);
        iframe.srcdoc = source;
        await loaded;
        doc = iframe.contentDocument;
        win = iframe.contentWindow;
        if (!doc || !win || !doc.body) throw new Error('Could not access the HTML preview.');
        const style = doc.createElement('style');
        style.textContent = '[data-h2f~="b"]::before{content:none!important}[data-h2f~="a"]::after{content:none!important}';
        (doc.head || doc.documentElement).appendChild(style);
        if (opts.runScripts) {
          setStatus('Running page scripts…');
          await waitForDomToSettle();
        }
        await waitForPageAssets();
        // ponytail: fixed wait for canvas chart intro animations (Chart.js ≈ 1s); hook the library if it needs more.
        if (opts.runScripts && doc.querySelector('canvas')) await sleep(1200);
        freezePage();
        await sleep(50);
        win.scrollTo(0, 0);
        setStatus('Measuring layout…');
        return await serializePage(opts);
      } finally {
        renderHost.innerHTML = '';
        renderHost.style.width = '1px';
        doc = null;
        win = null;
      }
    }

    async function serializePage(opts) {
      const root = doc.documentElement, body = doc.body;
      const hcs = win.getComputedStyle(root), bcs = win.getComputedStyle(body);
      const w = opts.width;
      const h = Math.ceil(Math.max(root.scrollHeight, body.scrollHeight, opts.height));
      // The canvas background comes from <html>, or from <body> when <html> has none.
      bodyBgOnCanvas = !parseColor(hcs.backgroundColor) && hcs.backgroundImage === 'none';
      const fills = await backgroundPaints(bodyBgOnCanvas ? body : root, bodyBgOnCanvas ? bcs : hcs, { x: 0, y: 0, w: w, h: h });
      if (!(fills[0] && fills[0].type === 'SOLID' && fills[0].color.a > 0.999)) fills.unshift(solidPaint({ r: 1, g: 1, b: 1, a: 1 }));
      const bodyNode = await serializeElement(body, null);
      if (!bodyNode) {
        throw new Error('Layout measured an empty page. Try again, or paste a full HTML document with inline CSS.');
      }
      return { type: 'frame', name: 'Page', x: 0, y: 0, w: w, h: h, fills: fills, effects: [], clip: true, children: [bodyNode] };
    }

    convertBtn.addEventListener('click', async function () {
      if (isImporting) return;
      const html = htmlInput.value.trim();
      if (!html) {
        setStatus('Choose an HTML file to import, or paste HTML below.', 'error');
        fileInput.click();
        return;
      }

      const opts = { width: viewport.w, height: viewport.h, runScripts: runScriptsInput.checked };
      scriptsSkipped = !opts.runScripts && /<script\b/i.test(html);
      setImporting(true, 'Rendering page…');
      setStatus('Rendering at ' + opts.width + ' × ' + opts.height + '…');

      try {
        const page = await inlineAssets(html, assetFiles);
        const tree = await withTimeout(captureHtmlTree(page, opts), 90000, 'Render');
        setImporting(true, 'Creating Figma layers…');
        setStatus('Importing…');
        parent.postMessage({
          pluginMessage: {
            type: 'convert',
            tree: tree,
            images: imageStore,
            viewportWidth: opts.width,
            asComponent: asComponentInput.checked
          }
        }, '*');
        importTimeout = setTimeout(function () {
          setImporting(false);
          setStatus(
            'Figma did not finish the import. Try a smaller self-contained HTML file, then run the plugin again.',
            'error'
          );
        }, 120000);
      } catch (err) {
        renderHost.innerHTML = '';
        setStatus(err && err.message ? err.message : String(err), 'error');
        setImporting(false);
      }
    });

    onmessage = function (event) {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || msg.type === 'convert') return;
      setImporting(false);
      if (msg.type === 'done') {
        let text = 'Imported · ' + msg.count + ' layers' + (msg.styles ? ' · ' + msg.styles + ' colors' : '');
        if (msg.missingFonts && msg.missingFonts.length) {
          text += '\nNot in Figma (substituted): ' + msg.missingFonts.slice(0, 6).join(', ');
        }
        if (scriptsSkipped) text += '\nThis page has scripts. If something is missing, tick “Execute page scripts”.';
        setStatus(text, 'ok');
      } else if (msg.type === 'error') {
        setStatus(msg.message, 'error');
      }
    };
  </script>
</body>
</html>
